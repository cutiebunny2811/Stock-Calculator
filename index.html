<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0c0f">
  <title>DCA Tracker</title>
  <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/📈">
  <link rel="icon" href="https://emojicdn.elk.sh/📈">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c0f;
      --surface: #111318;
      --surface2: #181c23;
      --border: #1f2430;
      --border2: #2a3040;
      --text: #e8eaf0;
      --muted: #5a6070;
      --accent: #00d4aa;
      --warn: #f59e0b;
      --danger: #ef4444;
      --green: #22c55e;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    .app {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 100px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header .sub {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 3px;
    }
    .badge {
      background: #00d4aa15;
      border: 1px solid #00d4aa40;
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 1px;
    }
    .save-indicator {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 11px;
      border-radius: 11px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--surface2);
      color: var(--accent);
      border: 1px solid var(--border2);
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Number Input ── */
    .num-wrap {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      height: 44px;
      transition: border-color 0.2s;
    }
    .num-wrap:focus-within { border-color: var(--accent); }
    .num-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      padding: 0 12px;
      width: 100%;
    }
    .num-affix {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 0 12px;
      background: var(--surface);
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--border2);
      flex-shrink: 0;
    }
    .num-affix.right {
      border-right: none;
      border-left: 1px solid var(--border2);
    }

    /* ── Master Cash Pool ── */
    .pool-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pool-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
      font-weight: 600;
    }
    .pool-total {
      grid-column: 1/-1;
      background: #00d4aa0e;
      border: 1px solid #00d4aa30;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .pool-total-label { font-size: 12px; color: var(--accent); font-weight: 700; }
    .pool-total-value {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
    }

    /* ── Stats Row ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .stat-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 7px; font-weight: 600; }
    .stat-value { font-family: var(--font-display); font-size: 16px; font-weight: 700; }

    /* ── Alloc Bar ── */
    .alloc-bar-wrap { margin-bottom: 16px; }
    .alloc-bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .alloc-track { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .alloc-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

    /* ── Table Header ── */
    .table-header {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      padding: 0 6px;
      margin-bottom: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Asset Row ── */
    .asset-row {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .asset-row:hover { border-color: var(--border2); }
    .asset-row.selected { border-color: var(--accent); background: #00d4aa08; }
    .asset-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .asset-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
    }
    .asset-fields {
      display: grid;
      grid-template-columns: 90px 1fr 1fr;
      gap: 10px;
      align-items: end;
    }
    .field-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 600; }
    .remaining-val {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 800;
      text-align: right;
    }
    .quota-hint { font-size: 9px; color: var(--muted); text-align: right; margin-bottom: 5px; }
    .progress-bar { height: 4px; background: var(--surface); border-radius: 4px; margin-top: 12px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
    .btn-del {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }
    .btn-del:hover { color: var(--danger); }

    /* ── Overweight Panel ── */
    .over-panel { display: none; }
    .over-panel.open {
      display: block;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #ef444410;
      border: 1px solid #ef444440;
    }
    .over-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--danger);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .over-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .over-item {
      background: #ef444418;
      border: 1px solid #ef444430;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .over-item.sell {
      background: #f59e0b18;
      border-color: #f59e0b40;
    }
    .over-item .oi-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .over-item .oi-val { font-family: var(--font-display); font-size: 15px; font-weight: 800; margin-top: 2px; }
    .over-note {
      font-size: 10px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
    }
    .over-note span { color: var(--warn); font-weight: 700; }

    /* ── Tranche Panel (expanded) ── */
    .tranche-panel { display: none; }
    .tranche-panel.open {
      display: block;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .tranche-hint {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .tranche-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tranche-mini {
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .tranche-mini .tm-label { font-size: 10px; font-weight: 700; margin-bottom: 2px; }
    .tranche-mini .tm-pct { font-size: 9px; color: var(--muted); margin-bottom: 6px; }
    .tranche-mini .tm-amt { font-family: var(--font-display); font-size: 14px; font-weight: 700; }

    /* ── Add Asset ── */
    .add-form { display: flex; flex-direction: column; gap: 10px; }
    .add-form-row1 { display: flex; gap: 10px; }
    .add-form-row2 { display: flex; gap: 10px; }
    .add-form .text-input {
      flex: 1;
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 600;
      padding: 0 14px;
      height: 44px;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s;
      width: 100%;
    }
    .add-form .text-input:focus { border-color: var(--accent); }
    .add-form .pct-wrap { width: 110px; flex-shrink: 0; }
    .btn-add {
      flex: 1;
      height: 44px;
      padding: 0 18px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .btn-add:hover { opacity: 0.85; }

    /* ── Tranche Tab ── */
    .tranche-settings {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    .tranche-settings .t-field { flex: 1; min-width: 70px; }
    .tranche-settings .t-field-label { font-size: 10px; font-weight: 700; margin-bottom: 6px; }
    .tranche-total-badge {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      align-self: flex-end;
      height: 44px;
      display: flex;
      align-items: center;
    }
    .tranche-warn { font-size: 10px; color: var(--danger); margin-top: 10px; }

    .tranche-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .tranche-big-card {
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .tranche-big-card .tb-label { font-family: var(--font-display); font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .tranche-big-card .tb-pct { font-size: 9px; color: var(--muted); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    .tranche-big-card .tb-amount { font-family: var(--font-display); font-size: 20px; font-weight: 800; }
    .tranche-big-card .tb-sub { font-size: 9px; color: var(--muted); margin-top: 4px; }

    .per-asset-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .par-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .par-name { font-family: var(--font-display); font-size: 15px; font-weight: 700; }
    .par-quota { font-size: 11px; color: var(--muted); font-weight: 600; }
    .par-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .par-t {
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }
    .par-t .pt-label { font-size: 10px; font-weight: 700; margin-bottom: 2px; }
    .par-t .pt-amt { font-family: var(--font-display); font-size: 14px; font-weight: 700; margin-top: 2px; }
    .par-t .pt-pct { font-size: 9px; margin-top: 2px; }

    .empty-state { text-align: center; color: var(--green); padding: 30px; font-size: 13px; font-weight: 600; }

    /* ── Currency Toggle ── */
    .currency-toggle {
      display: flex;
      background: var(--surface2);
      border: 1.5px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      height: 36px;
    }
    .cur-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 14px;
      transition: all 0.2s;
    }
    .cur-btn.active {
      background: var(--accent);
      color: #000;
    }
    .rate-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 14px;
      background: #0088ff0a;
      border: 1px solid #0088ff30;
      border-radius: 10px;
    }
    .rate-label { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .rate-input-wrap { flex: 1; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  </style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const DEFAULT_ASSETS = [
  { id: 1, name: "AAPL",  targetPct: 5,  bought: 0 },
  { id: 2, name: "META",  targetPct: 10, bought: 0 },
  { id: 3, name: "GOOGL", targetPct: 15, bought: 0 },
  { id: 4, name: "TSM",   targetPct: 15, bought: 0 },
  { id: 5, name: "AVGO",  targetPct: 10, bought: 0 },
  { id: 6, name: "ASTS",  targetPct: 10, bought: 0 },
  { id: 7, name: "NEE",   targetPct: 10, bought: 0 },
  { id: 8, name: "GLDM",  targetPct: 10, bought: 0 },
  { id: 9, name: "BTC",   targetPct: 10, bought: 0 },
];

const DEFAULT_TRANCHES = [
  { label: "ไม้ 1", pct: 15, color: "#00d4aa" },
  { label: "ไม้ 2", pct: 35, color: "#f59e0b" },
  { label: "ไม้ 3", pct: 50, color: "#ef4444" },
];

const fmt = (n) => n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function NumInput({ value, onChange, prefix, suffix, center = false }) {
  return (
    <div className="num-wrap">
      {prefix && <span className="num-affix">{prefix}</span>}
      <input
        type="number"
        value={value === 0 ? "" : value}
        placeholder="0"
        onChange={e => onChange(parseFloat(e.target.value) || 0)}
        style={{ textAlign: center ? "center" : "left" }}
      />
      {suffix && <span className="num-affix right">{suffix}</span>}
    </div>
  );
}

function App() {
  const load = (key, def) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
    catch { return def; }
  };

  const [initial,  setInitial]  = useState(() => load("dca_initial", 70000));
  const [added,    setAdded]    = useState(() => load("dca_added", 0));
  const [assets,   setAssets]   = useState(() => load("dca_assets", DEFAULT_ASSETS));
  const [tranches, setTranches] = useState(() => load("dca_tranches", DEFAULT_TRANCHES));
  const [currency, setCurrency] = useState(() => load("dca_currency", "THB"));
  const [rate,     setRate]     = useState(() => load("dca_rate", 33.5));
  const [newName,  setNewName]  = useState("");
  const [newPct,   setNewPct]   = useState(5);
  const [selected, setSelected] = useState(null);
  const [tab,      setTab]      = useState("tracker");
  const [saved,    setSaved]    = useState(false);

  // Auto-save
  useEffect(() => {
    localStorage.setItem("dca_initial",  JSON.stringify(initial));
    localStorage.setItem("dca_added",    JSON.stringify(added));
    localStorage.setItem("dca_assets",   JSON.stringify(assets));
    localStorage.setItem("dca_tranches", JSON.stringify(tranches));
    localStorage.setItem("dca_currency", JSON.stringify(currency));
    localStorage.setItem("dca_rate",     JSON.stringify(rate));
    setSaved(true);
    const t = setTimeout(() => setSaved(false), 1200);
    return () => clearTimeout(t);
  }, [initial, added, assets, tranches, currency, rate]);

  // Currency helpers — ทุกอย่างเก็บในบาท แค่แสดงเป็น USD
  const isUSD  = currency === "USD";
  const sym    = isUSD ? "$" : "฿";
  const disp   = (thb) => isUSD ? thb / rate : thb;          // บาท → แสดง
  const toThb  = (val) => isUSD ? val * rate : val;            // input → บาท
  const fmtC   = (thb) => fmt(disp(thb));                    // format พร้อม convert

  const totalCapital   = initial + added;
  const totalAllocated = assets.reduce((s, a) => s + a.targetPct, 0);
  const trancheTotal   = tranches.reduce((s, t) => s + t.pct, 0);

  const enriched = useMemo(() =>
    assets.map(a => {
      const quota     = (totalCapital * a.targetPct) / 100;
      const remaining = quota - a.bought;
      const progress  = quota > 0 ? Math.min((a.bought / quota) * 100, 100) : 0;
      return { ...a, quota, remaining, progress };
    }), [assets, totalCapital]
  );

  const totalBought    = enriched.reduce((s, a) => s + a.bought, 0);
  const totalRemaining = totalCapital - totalBought;  // หักเงินที่ซื้อเกินออกด้วย
  const totalOverweight = enriched.reduce((s, a) => s + (a.remaining < 0 ? Math.abs(a.remaining) : 0), 0);

  const updateAsset  = (id, field, val) => setAssets(p => p.map(a => a.id === id ? { ...a, [field]: val } : a));
  const removeAsset  = (id) => { if (confirm("ลบสินทรัพย์นี้?")) { setAssets(p => p.filter(a => a.id !== id)); if (selected === id) setSelected(null); } };
  const addAsset     = () => { if (!newName.trim()) return; setAssets(p => [...p, { id: Date.now(), name: newName.toUpperCase(), targetPct: newPct, bought: 0 }]); setNewName(""); setNewPct(5); };
  const updateTranche = (i, val) => setTranches(p => p.map((t, idx) => idx === i ? { ...t, pct: Math.max(0, val) } : t));

  const allocColor = Math.abs(totalAllocated - 100) < 0.01 ? "var(--green)" : "var(--danger)";

  return (
    <div>
      {/* Header */}
      <div className="header">
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
            <h1>DCA Tracker</h1>
            <span className="badge">Portfolio</span>
          </div>
          <div className="sub">Dollar Cost Averaging</div>
        </div>
        <div style={{ textAlign: "right", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "6px" }}>
          <div className="currency-toggle">
            <button className={`cur-btn ${!isUSD ? "active" : ""}`} onClick={() => setCurrency("THB")}>฿ THB</button>
            <button className={`cur-btn ${isUSD ? "active" : ""}`} onClick={() => setCurrency("USD")}>$ USD</button>
          </div>
          <div className="save-indicator">{saved ? "✓ SAVED" : "AUTO-SAVE"}</div>
        </div>
      </div>

      {/* Tabs */}
      <div className="tabs">
        <button className={`tab ${tab === "tracker" ? "active" : ""}`} onClick={() => setTab("tracker")}>📊 Quota Tracker</button>
        <button className={`tab ${tab === "tranche" ? "active" : ""}`} onClick={() => setTab("tranche")}>🎯 คำนวณไม้ DCA</button>
      </div>

      {/* Master Cash Pool */}
      <div className="card">
        <div className="card-title">💰 Master Cash Pool</div>
        <div className="pool-grid">
          <div>
            <div className="pool-label">ทุนตั้งต้น</div>
            <NumInput value={parseFloat(disp(initial).toFixed(2))} onChange={v => setInitial(toThb(v))} prefix={sym} />
          </div>
          <div>
            <div className="pool-label">เงินที่เติมเพิ่ม</div>
            <NumInput value={parseFloat(disp(added).toFixed(2))} onChange={v => setAdded(toThb(v))} prefix={sym} />
          </div>
          <div className="pool-total">
            <div className="pool-total-label">รวมเงินทุนทั้งหมด</div>
            <div className="pool-total-value">{sym}{fmtC(totalCapital)}</div>
          </div>
        </div>
        {isUSD && (
          <div className="rate-row">
            <div className="rate-label">🔄 1 USD =</div>
            <div className="rate-input-wrap">
              <NumInput value={rate} onChange={setRate} suffix="฿" />
            </div>
          </div>
        )}
      </div>

      {/* ══ TAB: TRACKER ══ */}
      {tab === "tracker" && <>
        <div className="stats-row">
          <div className="stat-box">
            <div className="stat-label">ซื้อไปแล้ว</div>
            <div className="stat-value" style={{ color: "var(--warn)" }}>{sym}{fmtC(totalBought)}</div>
          </div>
          <div className="stat-box" style={ totalRemaining < 0 ? { borderColor: "#ef444440", background: "#ef444408" } : {} }>
            <div className="stat-label" style={{ color: totalRemaining < 0 ? "var(--danger)" : undefined }}>
              {totalRemaining < 0 ? "ใช้เกินงบ" : "กระสุนเหลือ"}
            </div>
            <div className="stat-value" style={{ color: totalRemaining < 0 ? "var(--danger)" : "var(--accent)" }}>
              {totalRemaining < 0 ? `-${sym}${fmtC(Math.abs(totalRemaining))}` : `${sym}${fmtC(totalRemaining)}`}
            </div>
          </div>
          <div className="stat-box" style={ totalOverweight > 0 ? { borderColor: "#ef444440", background: "#ef444408" } : {} }>
            <div className="stat-label" style={{ color: totalOverweight > 0 ? "var(--danger)" : undefined }}>
              {totalOverweight > 0 ? "⚠️ เกินโควตา" : "Alloc รวม"}
            </div>
            <div className="stat-value" style={{ color: totalOverweight > 0 ? "var(--danger)" : allocColor }}>
              {totalOverweight > 0 ? `${sym}${fmtC(totalOverweight)}` : `${totalAllocated.toFixed(1)}%`}
            </div>
          </div>
        </div>

        <div className="alloc-bar-wrap">
          <div className="alloc-bar-top">
            <span>Allocation</span>
            <span style={{ color: allocColor }}>
              {totalAllocated > 100 ? `เกิน ${(totalAllocated - 100).toFixed(1)}%`
               : totalAllocated < 100 ? `เหลือ ${(100 - totalAllocated).toFixed(1)}%`
               : "✓ ครบ 100%"}
            </span>
          </div>
          <div className="alloc-track">
            <div className="alloc-fill" style={{
              width: `${Math.min(totalAllocated, 100)}%`,
              background: totalAllocated > 100 ? "var(--danger)" : totalAllocated === 100 ? "var(--green)" : "var(--accent)"
            }} />
          </div>
        </div>

        <div className="table-header">
          <span>สินทรัพย์ / เป้าหมาย %</span>
          <span>ซื้อแล้ว / โควตาเหลือ</span>
        </div>

        {enriched.map(a => (
          <div key={a.id} className={`asset-row ${selected === a.id ? "selected" : ""}`}
            style={ a.remaining < 0 ? { borderColor: selected === a.id ? "var(--danger)" : "#ef444430", background: selected === a.id ? "#ef444408" : undefined } : {} }
            onClick={() => setSelected(selected === a.id ? null : a.id)}>
            <div className="asset-top">
              <div className="asset-name">{a.name}</div>
              <button className="btn-del" onClick={e => { e.stopPropagation(); removeAsset(a.id); }}>×</button>
            </div>

            <div className="asset-fields">
              <div onClick={e => e.stopPropagation()}>
                <div className="field-label">เป้าหมาย</div>
                <NumInput value={a.targetPct} onChange={v => updateAsset(a.id, "targetPct", v)} suffix="%" center />
              </div>
              <div onClick={e => e.stopPropagation()}>
                <div className="field-label">ซื้อแล้ว</div>
                <NumInput value={parseFloat(disp(a.bought).toFixed(2))} onChange={v => updateAsset(a.id, "bought", toThb(v))} prefix={sym} />
              </div>
              <div style={{ textAlign: "right" }}>
                <div className="quota-hint">โควตา {sym}{fmtC(a.quota)}</div>
                <div className="remaining-val" style={{
                  color: a.remaining < 0 ? "var(--danger)" : a.remaining === 0 ? "var(--green)" : a.remaining < a.quota * 0.35 ? "var(--warn)" : "var(--danger)"
                }}>
                  {a.remaining < 0
                    ? `เกิน ${sym}${fmtC(Math.abs(a.remaining))}`
                    : a.remaining === 0 ? "✓ FULL"
                    : `${sym}${fmtC(a.remaining)}`}
                </div>
              </div>
            </div>

            <div className="progress-bar">
              <div className="progress-fill" style={{
                width: `${a.progress}%`,
                background: a.progress >= 100 ? "var(--green)" : a.progress > 50 ? "var(--warn)" : "var(--accent)"
              }} />
            </div>

            {/* Overweight panel */}
            {a.remaining < 0 && (
              <div className={`over-panel ${selected === a.id ? "open" : ""}`} onClick={e => e.stopPropagation()}>
                <div className="over-title">⚠️ ซื้อเกินโควตา — Rebalance Guide</div>
                <div className="over-grid">
                  <div className="over-item">
                    <div className="oi-label" style={{ color: "var(--danger)" }}>เกินไป</div>
                    <div className="oi-val" style={{ color: "var(--danger)" }}>{sym}{fmtC(Math.abs(a.remaining))}</div>
                  </div>
                  <div className="over-item">
                    <div className="oi-label" style={{ color: "var(--danger)" }}>% เกิน</div>
                    <div className="oi-val" style={{ color: "var(--danger)" }}>{((Math.abs(a.remaining) / a.quota) * 100).toFixed(1)}%</div>
                  </div>
                  <div className="over-item sell">
                    <div className="oi-label" style={{ color: "var(--warn)" }}>ควรขาย</div>
                    <div className="oi-val" style={{ color: "var(--warn)" }}>{sym}{fmtC(Math.abs(a.remaining))}</div>
                  </div>
                </div>
                <div className="over-note">
                  ถือเกิน <span>{((a.bought / a.quota) * 100).toFixed(1)}%</span> ของโควตา · ขายออก <span>{sym}{fmtC(Math.abs(a.remaining))}</span> เพื่อ rebalance กลับที่ <span>{sym}{fmtC(a.quota)}</span>
                </div>
              </div>
            )}

            {/* Tranche panel — แสดงเฉพาะตอนยังมีกระสุนเหลือ */}
            {a.remaining > 0 && (
            <div className={`tranche-panel ${selected === a.id ? "open" : ""}`} onClick={e => e.stopPropagation()}>
              <div className="tranche-hint">แผนยิงไม้ · โควตาเหลือ {sym}{fmtC(Math.max(a.remaining, 0))}</div>
              <div className="tranche-mini-grid">
                {tranches.map(t => {
                  const amt = (Math.max(a.remaining, 0) * t.pct) / 100;
                  return (
                    <div key={t.label} className="tranche-mini"
                      style={{ background: t.color + "14", border: `1px solid ${t.color}44` }}>
                      <div className="tm-label" style={{ color: t.color }}>{t.label}</div>
                      <div className="tm-pct">{t.pct}%</div>
                      <div className="tm-amt" style={{ color: t.color }}>{sym}{fmtC(amt)}</div>
                    </div>
                  );
                })}
              </div>
            </div>
            )}
          </div>
        ))}

        <div className="card" style={{ marginTop: "20px" }}>
          <div className="card-title">➕ เพิ่มสินทรัพย์</div>
          <div className="add-form">
            <input className="text-input" placeholder="TICKER (เช่น TSLA)"
              value={newName} onChange={e => setNewName(e.target.value)}
              onKeyDown={e => e.key === "Enter" && addAsset()} />
            <div className="add-form-row2">
              <div className="pct-wrap">
                <NumInput value={newPct} onChange={setNewPct} suffix="%" center />
              </div>
              <button className="btn-add" onClick={addAsset}>+ เพิ่ม</button>
            </div>
          </div>
        </div>
      </>}

      {/* ══ TAB: TRANCHE ══ */}
      {tab === "tranche" && <>
        <div className="card">
          <div className="card-title">⚙️ ตั้งค่าสัดส่วนไม้</div>
          <div className="tranche-settings">
            {tranches.map((t, i) => (
              <div key={i} className="t-field">
                <div className="t-field-label" style={{ color: t.color }}>{t.label}</div>
                <NumInput value={t.pct} onChange={v => updateTranche(i, v)} suffix="%" center />
              </div>
            ))}
            <div className="tranche-total-badge" style={{
              background: Math.abs(trancheTotal - 100) < 0.01 ? "#22c55e18" : "#ef444418",
              border: `1px solid ${Math.abs(trancheTotal - 100) < 0.01 ? "#22c55e44" : "#ef444444"}`,
              color: Math.abs(trancheTotal - 100) < 0.01 ? "var(--green)" : "var(--danger)",
            }}>
              {trancheTotal}% {Math.abs(trancheTotal - 100) < 0.01 ? "✓" : trancheTotal > 100 ? `↑${trancheTotal - 100}%` : `↓${100 - trancheTotal}%`}
            </div>
          </div>
          {Math.abs(trancheTotal - 100) > 0.01 && (
            <div className="tranche-warn">⚠️ รวมไม้ควรได้ 100% เพื่อใช้กระสุนให้ครบ</div>
          )}
        </div>

        <div className="card">
          <div className="card-title">🎯 สรุปยอดแต่ละไม้</div>
          <div style={{ fontSize: "11px", color: "var(--muted)", marginBottom: "14px", fontWeight: 500 }}>
            คำนวณจาก <span style={{ color: "var(--accent)", fontWeight: 700 }}>กระสุนที่เหลือจริง</span> {sym}{fmtC(Math.max(totalRemaining, 0))}
          </div>
          <div className="tranche-summary-grid">
            {tranches.map(t => (
              <div key={t.label} className="tranche-big-card"
                style={{ background: t.color + "12", border: `1px solid ${t.color}44` }}>
                <div className="tb-label" style={{ color: t.color }}>{t.label}</div>
                <div className="tb-pct">{t.pct}% ของที่เหลือ</div>
                <div className="tb-amount" style={{ color: t.color }}>{sym}{fmtC((Math.max(totalRemaining, 0) * t.pct) / 100)}</div>
                <div className="tb-sub">รวมทุกตัว</div>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <div className="card-title">📋 แยกตามสินทรัพย์</div>
          {enriched.filter(a => a.remaining > 0).length === 0
            ? <div className="empty-state">✓ ทุกสินทรัพย์ DCA เต็มโควตาแล้ว!</div>
            : enriched.filter(a => a.remaining > 0).map(a => (
              <div key={a.id} className="per-asset-row">
                <div className="par-top">
                  <div className="par-name">{a.name}</div>
                  <div className="par-quota">เหลือ {sym}{fmtC(a.remaining)}</div>
                </div>
                <div className="par-grid">
                  {tranches.map(t => {
                    const amt = (a.remaining * t.pct) / 100;
                    return (
                      <div key={t.label} className="par-t"
                        style={{ background: t.color + "14", border: `1px solid ${t.color}33` }}>
                        <div className="pt-label" style={{ color: t.color }}>{t.label}</div>
                        <div className="pt-amt" style={{ color: t.color }}>{sym}{fmtC(amt)}</div>
                        <div className="pt-pct" style={{ color: t.color + "99" }}>{t.pct}%</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))
          }
        </div>
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
