<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Allocation</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="StockAlloc">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        body { -webkit-tap-highlight-color: transparent; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-black text-zinc-100 antialiased min-h-screen p-4 pb-20 selection:bg-cyan-500/30 font-sans">

    <div class="max-w-md mx-auto space-y-6 fade-in">
        
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-cyan-500 to-blue-600 p-2.5 rounded-xl shadow-lg shadow-cyan-900/20">
                    <i data-lucide="pie-chart" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">Stock Allocation</h1>
                    <p class="text-xs text-zinc-500">Portfolio distribution & planning</p>
                </div>
            </div>
            <button onclick="toggleCurrency()" class="flex items-center bg-zinc-900 border border-zinc-800 rounded-full p-1 relative h-8 w-14 transition-colors">
                <div id="currency-indicator" class="absolute left-1 w-6 h-6 bg-cyan-600 rounded-full flex items-center justify-center text-[10px] font-bold transition-all shadow-md">฿</div>
                <span class="absolute right-2 text-[10px] text-zinc-600 font-bold">$</span>
            </button>
        </div>

        <div class="bg-zinc-900/80 rounded-2xl border border-zinc-800 p-5 shadow-lg">
            <label class="block text-xs font-medium text-zinc-500 mb-2 uppercase tracking-wider flex items-center gap-2">
                <i data-lucide="wallet" class="w-3 h-3"></i> Total Investment Capital
            </label>
            <div class="relative group">
                <span id="capital-symbol" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500 font-medium transition-colors group-focus-within:text-cyan-400">฿</span>
                <input type="number" id="capital" placeholder="0" oninput="updateData()" class="w-full bg-black border border-zinc-800 rounded-xl py-3 pl-10 pr-4 text-2xl font-bold text-white focus:ring-2 focus:ring-cyan-500/30 outline-none transition-all placeholder-zinc-800">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-zinc-900/50 rounded-xl border border-zinc-800 p-4 relative overflow-hidden">
                <div class="absolute right-0 top-0 p-3 opacity-10">
                    <i data-lucide="check-circle" class="w-12 h-12 text-cyan-500"></i>
                </div>
                <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Total Allocated</p>
                <h3 id="total-allocated" class="text-2xl font-bold text-cyan-400">0%</h3>
            </div>
            <div class="bg-zinc-900/50 rounded-xl border border-zinc-800 p-4 relative overflow-hidden">
                <div class="absolute right-0 top-0 p-3 opacity-10">
                    <i data-lucide="coins" class="w-12 h-12 text-zinc-400"></i>
                </div>
                <p class="text-[10px] text-zinc-500 uppercase tracking-wider mb-1">Remaining Cash</p>
                <h3 id="remaining-cash" class="text-xl font-bold text-zinc-300">0</h3>
            </div>
        </div>

        <div class="bg-zinc-900/80 rounded-2xl border border-zinc-800 p-6 shadow-lg flex flex-col items-center justify-center relative min-h-[300px]">
            <h3 class="absolute top-5 left-5 text-sm font-medium text-white">Visual Breakdown</h3>
            <div class="w-64 h-64 relative mt-4">
                <canvas id="allocationChart"></canvas>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <p class="text-xs text-zinc-600 font-medium">Allocation</p>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-lg font-bold text-white">Portfolio Holdings</h3>
                <button onclick="addStock()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium transition-all shadow-lg shadow-cyan-900/30 flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Stock
                </button>
            </div>

            <div class="grid grid-cols-12 gap-2 px-4 py-2 text-[10px] font-bold text-zinc-600 uppercase tracking-wider">
                <div class="col-span-4">Ticker</div>
                <div class="col-span-3 text-center">Weight (%)</div>
                <div class="col-span-4 text-right">Value</div>
                <div class="col-span-1"></div>
            </div>

            <div id="stock-list" class="space-y-2 pb-10">
                </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // --- STATE MANAGEMENT ---
        let state = {
            capital: 10000,
            currency: 'THB', // 'THB' or 'USD'
            stocks: [
                { id: '1', symbol: 'AAPL', weight: 40 },
                { id: '2', symbol: 'MSFT', weight: 30 },
                { id: '3', symbol: 'GOOGL', weight: 20 }
            ]
        };

        let chartInstance = null;

        // --- LOAD & SAVE DATA ---
        function loadData() {
            const saved = localStorage.getItem('stock_allocation_data');
            if (saved) {
                state = JSON.parse(saved);
            }
            // Update UI inputs from state
            document.getElementById('capital').value = state.capital;
            renderCurrencyUI();
            renderStocks();
            updateCalculations();
        }

        function saveData() {
            localStorage.setItem('stock_allocation_data', JSON.stringify(state));
        }

        // --- LOGIC ---

        function toggleCurrency() {
            state.currency = state.currency === 'THB' ? 'USD' : 'THB';
            renderCurrencyUI();
            updateCalculations();
            saveData();
        }

        function renderCurrencyUI() {
            const ind = document.getElementById('currency-indicator');
            const sym = document.getElementById('capital-symbol');
            
            if (state.currency === 'THB') {
                ind.style.transform = 'translateX(0)';
                ind.innerText = '฿';
                ind.classList.replace('bg-green-600', 'bg-cyan-600');
                sym.innerText = '฿';
            } else {
                ind.style.transform = 'translateX(24px)'; // Move toggle
                ind.innerText = '$';
                ind.classList.replace('bg-cyan-600', 'bg-green-600');
                sym.innerText = '$';
            }
        }

        function updateData() {
            // Update capital from input
            const capVal = parseFloat(document.getElementById('capital').value);
            state.capital = isNaN(capVal) ? 0 : capVal;
            updateCalculations();
            saveData();
        }

        function updateStock(id, field, value) {
            const stock = state.stocks.find(s => s.id === id);
            if (stock) {
                if (field === 'symbol') stock.symbol = value.toUpperCase();
                if (field === 'weight') stock.weight = parseFloat(value) || 0;
            }
            updateCalculations();
            saveData();
        }

        function addStock() {
            const newId = Math.random().toString(36).substr(2, 9);
            state.stocks.push({ id: newId, symbol: '', weight: 0 });
            renderStocks();
            saveData();
        }

        function deleteStock(id) {
            state.stocks = state.stocks.filter(s => s.id !== id);
            renderStocks();
            updateCalculations();
            saveData();
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'decimal',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(amount);
        }

        // --- RENDERERS ---

        function renderStocks() {
            const container = document.getElementById('stock-list');
            container.innerHTML = '';

            state.stocks.forEach(stock => {
                const stockValue = state.capital * (stock.weight / 100);
                const currencySym = state.currency === 'THB' ? '฿' : '$';

                const html = `
                <div class="grid grid-cols-12 gap-2 items-center bg-zinc-900 border border-zinc-800 p-3 rounded-xl fade-in group focus-within:border-cyan-500/50 transition-colors">
                    <div class="col-span-4">
                        <input type="text" value="${stock.symbol}" 
                            oninput="updateStock('${stock.id}', 'symbol', this.value)"
                            placeholder="TICKER" 
                            class="w-full bg-transparent text-white font-bold uppercase placeholder-zinc-700 outline-none">
                    </div>
                    <div class="col-span-3">
                        <input type="number" value="${stock.weight}" 
                            oninput="updateStock('${stock.id}', 'weight', this.value)"
                            placeholder="0" 
                            class="w-full bg-black/50 text-cyan-400 font-bold text-center rounded-lg py-1 border border-zinc-800 focus:border-cyan-500/50 outline-none">
                    </div>
                    <div class="col-span-4 text-right">
                        <span class="text-xs text-zinc-500 mr-1">${currencySym}</span>
                        <span class="text-sm font-medium text-zinc-300">${formatMoney(stockValue)}</span>
                    </div>
                    <div class="col-span-1 text-right">
                        <button onclick="deleteStock('${stock.id}')" class="text-zinc-600 hover:text-rose-500 transition-colors">
                            <i data-lucide="trash-2" width="16"></i>
                        </button>
                    </div>
                </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
            lucide.createIcons();
        }

        function updateCalculations() {
            // 1. Calc Total Allocated
            const totalWeight = state.stocks.reduce((sum, s) => sum + s.weight, 0);
            const totalAllocatedElem = document.getElementById('total-allocated');
            totalAllocatedElem.innerText = totalWeight.toFixed(2) + '%';
            
            if (totalWeight > 100) totalAllocatedElem.className = 'text-2xl font-bold text-rose-500';
            else if (totalWeight === 100) totalAllocatedElem.className = 'text-2xl font-bold text-emerald-400';
            else totalAllocatedElem.className = 'text-2xl font-bold text-cyan-400';

            // 2. Calc Remaining Cash
            const remaining = state.capital * ((100 - totalWeight) / 100);
            const remainingElem = document.getElementById('remaining-cash');
            const currencySym = state.currency === 'THB' ? '฿' : '$';
            remainingElem.innerText = `${currencySym} ${formatMoney(remaining > 0 ? remaining : 0)}`;

            // 3. Re-render values in list (quick fix to update calculated values visually without re-rendering inputs)
            // Ideally we re-render specific DOM elements, but for simplicity here we assume inputs are bound.
            // Actually, let's just re-render list if we aren't editing? 
            // Better: update the text spans directly.
            const listItems = document.getElementById('stock-list').children;
            Array.from(listItems).forEach((item, index) => {
                const stock = state.stocks[index];
                if(stock) {
                    const valSpan = item.querySelector('.col-span-4.text-right span:last-child');
                    const symSpan = item.querySelector('.col-span-4.text-right span:first-child');
                    const val = state.capital * (stock.weight / 100);
                    valSpan.innerText = formatMoney(val);
                    symSpan.innerText = currencySym;
                }
            });

            updateChart();
        }

        // --- CHART ---
        function updateChart() {
            const ctx = document.getElementById('allocationChart').getContext('2d');
            
            // Prepare Data
            const labels = state.stocks.map(s => s.symbol || 'N/A');
            const data = state.stocks.map(s => s.weight);
            const totalWeight = data.reduce((a, b) => a + b, 0);
            
            // Add "Cash" segment if < 100%
            if (totalWeight < 100) {
                labels.push('CASH');
                data.push(100 - totalWeight);
            }

            // Colors
            const colors = [
                '#06b6d4', '#3b82f6', '#8b5cf6', '#d946ef', '#f43f5e', '#f97316', '#eab308', '#22c55e'
            ];
            // If Cash is last
            const bgColors = state.stocks.map((_, i) => colors[i % colors.length]);
            if (totalWeight < 100) bgColors.push('#27272a'); // Zinc-800 for cash

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = data;
                chartInstance.data.datasets[0].backgroundColor = bgColors;
                chartInstance.update();
            } else {
                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: bgColors,
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '75%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { 
                                    color: '#71717a', 
                                    font: { size: 10 },
                                    usePointStyle: true,
                                    boxWidth: 6
                                }
                            }
                        }
                    }
                });
            }
        }

        // Init App
        loadData();

    </script>
</body>
</html>
