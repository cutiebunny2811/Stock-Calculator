<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Allocation (Final Version)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000000; }
        /* ปรับแต่ง Scrollbar ให้เข้าธีม */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        /* Animation เล็กน้อย */
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-zinc-200 min-h-screen p-4 md:p-8 selection:bg-cyan-500/30">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-zinc-800 pb-6 gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-3 bg-cyan-500/10 rounded-xl border border-cyan-500/20 shadow-[0_0_15px_-3px_rgba(6,182,212,0.3)]">
                    <i data-lucide="pie-chart" class="w-8 h-8 text-cyan-400"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Stock Allocation</h1>
                    <p class="text-zinc-500 text-sm md:text-base">Portfolio distribution & planning</p>
                </div>
            </div>
            
            <button onclick="toggleCurrency()" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-700 hover:border-zinc-500 rounded-full text-sm font-medium transition-all text-zinc-300 hover:text-white group w-fit cursor-pointer">
                <div id="btn-thb" class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-colors bg-cyan-600 text-white">฿</div>
                <i data-lucide="arrow-right-left" class="w-3 h-3 text-zinc-500 group-hover:text-cyan-400"></i>
                <div id="btn-usd" class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-colors bg-zinc-800 text-zinc-500">$</div>
            </button>
        </header>

        <div class="grid lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-7 space-y-6">
                
                <section class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
                    <label class="block text-sm font-medium text-zinc-400 mb-2 flex items-center gap-2">
                        <i data-lucide="wallet" class="w-4 h-4"></i>
                        Total Investment Capital
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span id="currency-prefix" class="text-zinc-500 text-lg font-bold group-focus-within:text-cyan-400 transition-colors">฿</span>
                        </div>
                        <input type="number" id="totalCapital" value="10000" oninput="calculateAll()" 
                            class="w-full bg-black border border-zinc-700 rounded-xl py-4 pl-10 pr-4 text-xl font-bold text-white placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition-all">
                    </div>
                </section>

                <section class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 shadow-xl min-h-[400px] flex flex-col backdrop-blur-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-semibold text-white">Portfolio Holdings</h2>
                        <button onclick="addStock()" class="flex items-center gap-2 px-4 py-2 bg-cyan-700 hover:bg-cyan-600 text-white text-sm font-medium rounded-lg transition-all active:scale-95 shadow-lg shadow-cyan-900/20">
                            <i data-lucide="plus" class="w-4 h-4"></i> Add Stock
                        </button>
                    </div>

                    <div class="grid grid-cols-12 gap-3 text-xs font-semibold text-zinc-500 uppercase tracking-wider px-2 mb-3">
                        <div class="col-span-4 md:col-span-3">Ticker</div>
                        <div class="col-span-3 md:col-span-3">Weight (%)</div>
                        <div class="col-span-4 md:col-span-5 text-right">Value (<span id="currency-header">THB</span>)</div>
                        <div class="col-span-1"></div>
                    </div>

                    <div id="stockListContainer" class="space-y-3 flex-grow">
                        </div>
                </section>
            </div>

            <div class="lg:col-span-5 space-y-6">
                
                <div class="grid grid-cols-2 gap-4">
                    <div id="allocated-card" class="p-5 rounded-2xl border bg-emerald-950/20 border-emerald-900/40 text-emerald-200 transition-all">
                        <div class="text-xs font-medium uppercase tracking-wider opacity-80 mb-1">Total Allocated</div>
                        <div class="text-2xl font-bold flex items-baseline gap-1">
                            <span id="total-percent">0.00</span><span class="text-sm opacity-70">%</span>
                        </div>
                        <div id="over-budget-warning" class="hidden flex items-center gap-1.5 mt-2 text-rose-400 text-xs font-medium">
                            <i data-lucide="alert-triangle" class="w-3 h-3"></i> Exceeds 100%
                        </div>
                    </div>

                    <div class="p-5 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-200">
                        <div class="text-xs font-medium uppercase tracking-wider opacity-60 mb-1 text-zinc-400">Remaining Cash</div>
                        <div id="remaining-cash" class="text-2xl font-bold text-zinc-100">0</div>
                    </div>
                </div>

                <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 shadow-xl relative overflow-hidden backdrop-blur-sm">
                    <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
                        <i data-lucide="pie-chart" class="w-32 h-32"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-white mb-6 relative z-10">Visual Breakdown</h3>
                    
                    <div class="relative h-[300px] w-full z-10">
                        <canvas id="myChart"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span class="text-zinc-500 text-xs font-light">Allocation</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        let currentCurrency = 'THB';
        let stocks = [
            { id: 1, ticker: 'AAPL', percent: 40 },
            { id: 2, ticker: 'MSFT', percent: 30 },
            { id: 3, ticker: 'GOOGL', percent: 20 }
        ];
        let myChart = null;

        // --- INIT ---
        window.onload = function() {
            lucide.createIcons();
            renderStocks();
            calculateAll();
        };

        // --- FUNCTIONS ---

        function toggleCurrency() {
            currentCurrency = currentCurrency === 'THB' ? 'USD' : 'THB';
            
            // Update UI Buttons
            const btnTHB = document.getElementById('btn-thb');
            const btnUSD = document.getElementById('btn-usd');
            if(currentCurrency === 'THB') {
                btnTHB.className = "w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-colors bg-cyan-600 text-white";
                btnUSD.className = "w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-colors bg-zinc-800 text-zinc-500";
            } else {
                btnTHB.className = "w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-colors bg-zinc-800 text-zinc-500";
                btnUSD.className = "w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold transition-colors bg-cyan-600 text-white";
            }

            document.getElementById('currency-prefix').innerText = currentCurrency === 'THB' ? '฿' : '$';
            document.getElementById('currency-header').innerText = currentCurrency;
            calculateAll();
        }

        function addStock() {
            const newId = Date.now();
            stocks.push({ id: newId, ticker: '', percent: 0 });
            renderStocks();
            calculateAll();
        }

        function removeStock(id) {
            stocks = stocks.filter(s => s.id !== id);
            renderStocks();
            calculateAll();
        }

        function updateStock(id, field, value) {
            const stock = stocks.find(s => s.id === id);
            if (stock) {
                if (field === 'percent') {
                    stock.percent = parseFloat(value) || 0;
                } else {
                    stock.ticker = value.toUpperCase();
                }
            }
            calculateAll(); // Recalculate values, but don't re-render list to keep focus
            updateRowValue(id); // Update just the value text of this row
        }

        function renderStocks() {
            const container = document.getElementById('stockListContainer');
            container.innerHTML = '';

            stocks.forEach(stock => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-3 items-center bg-zinc-800/30 p-3 rounded-xl border border-zinc-800/50 hover:border-cyan-500/30 transition-colors group fade-in';
                row.innerHTML = `
                    <div class="col-span-4 md:col-span-3">
                        <input type="text" placeholder="TICKER" value="${stock.ticker}" 
                            oninput="updateStock(${stock.id}, 'ticker', this.value)"
                            class="w-full bg-transparent border-b border-transparent focus:border-cyan-500 outline-none text-white font-bold uppercase placeholder-zinc-600 transition-colors">
                    </div>

                    <div class="col-span-3 md:col-span-3 relative">
                        <input type="number" value="${stock.percent}" 
                            oninput="updateStock(${stock.id}, 'percent', this.value)"
                            class="w-full bg-zinc-900/50 rounded-lg px-2 py-1 text-right text-cyan-400 font-mono focus:outline-none focus:ring-1 focus:ring-cyan-500">
                    </div>

                    <div class="col-span-4 md:col-span-5 text-right font-mono text-zinc-300">
                        <span class="text-zinc-600 text-xs mr-1">${currentCurrency === 'THB' ? '฿' : '$'}</span>
                        <span id="val-${stock.id}">0.00</span>
                    </div>

                    <div class="col-span-1 flex justify-end">
                        <button onclick="removeStock(${stock.id})" class="text-zinc-600 hover:text-rose-500 transition-colors p-1 rounded-md hover:bg-rose-500/10">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
            lucide.createIcons();
            // Don't calculate here to avoid recursion loops, separate concern
        }

        function updateRowValue(id) {
            const total = parseFloat(document.getElementById('totalCapital').value) || 0;
            const stock = stocks.find(s => s.id === id);
            if (stock) {
                const val = total * (stock.percent / 100);
                const el = document.getElementById(`val-${id}`);
                if (el) el.innerText = val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }

        function calculateAll() {
            const totalCapital = parseFloat(document.getElementById('totalCapital').value) || 0;
            let totalPercent = 0;

            // Update row values
            stocks.forEach(s => {
                totalPercent += s.percent;
                const val = totalCapital * (s.percent / 100);
                const el = document.getElementById(`val-${s.id}`);
                if (el) el.innerText = val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            });

            // Update Total Stats
            document.getElementById('total-percent').innerText = totalPercent.toFixed(2);
            
            const remainingCash = totalCapital * ((100 - totalPercent) / 100);
            const prefix = currentCurrency === 'THB' ? '฿' : '$';
            const cashEl = document.getElementById('remaining-cash');
            cashEl.innerHTML = `<span class="text-lg opacity-60">${prefix}</span> ${remainingCash.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

            // Check Over Budget
            const card = document.getElementById('allocated-card');
            const warning = document.getElementById('over-budget-warning');
            
            if (totalPercent > 100) {
                card.className = "p-5 rounded-2xl border transition-all bg-rose-950/20 border-rose-900/50 text-rose-200";
                warning.classList.remove('hidden');
                cashEl.classList.add('text-rose-400');
                cashEl.classList.remove('text-zinc-100');
            } else {
                card.className = "p-5 rounded-2xl border transition-all bg-emerald-950/20 border-emerald-900/40 text-emerald-200";
                warning.classList.add('hidden');
                cashEl.classList.remove('text-rose-400');
                cashEl.classList.add('text-zinc-100');
            }

            updateChart(stocks, remainingCash, totalCapital);
        }

        function updateChart(dataStocks, cash, total) {
            const ctx = document.getElementById('myChart').getContext('2d');
            
            // Prepare Data
            let labels = [];
            let data = [];
            let colors = [];
            
            // Stock Segments
            const colorPalette = ['#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981']; // Cyan, Blue, Purple, Pink, Amber, Emerald
            
            dataStocks.forEach((s, index) => {
                if(s.percent > 0) {
                    labels.push(s.ticker || 'UNTITLED');
                    data.push(s.percent);
                    colors.push(colorPalette[index % colorPalette.length]);
                }
            });

            // Cash Segment
            if (cash > 0) {
                const cashPercent = (cash / total) * 100;
                labels.push('CASH');
                data.push(cashPercent);
                colors.push('#3f3f46'); // Zinc-700
            }

            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '75%',
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#a1a1aa', // Zinc-400
                                font: { family: 'Inter', size: 11 },
                                boxWidth: 10,
                                padding: 20
                            }
                        },
                        tooltip: {
                            backgroundColor: '#18181b',
                            borderColor: '#27272a',
                            borderWidth: 1,
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            callbacks: {
                                label: function(context) {
                                    return ' ' + context.label + ': ' + context.parsed.toFixed(1) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
