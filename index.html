<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCA Portfolio Tracker</title>
    <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/📈">
    <link rel="icon" href="https://emojicdn.elk.sh/📈">
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ─── Default Config ─────────────────────────────────────────────────────────
const DEFAULT_ASSETS = [
  { id: 1, name: "AAPL", targetPct: 5, bought: 0 },
  { id: 2, name: "META", targetPct: 10, bought: 0 },
  { id: 3, name: "GOOGL", targetPct: 15, bought: 0 },
  { id: 4, name: "TSM", targetPct: 15, bought: 0 },
  { id: 5, name: "AVGO", targetPct: 10, bought: 0 },
  { id: 6, name: "ASTS", targetPct: 10, bought: 0 },
  { id: 7, name: "NEE", targetPct: 10, bought: 0 },
  { id: 8, name: "GLDM", targetPct: 10, bought: 0 },
  { id: 9, name: "BTC", targetPct: 10, bought: 0 },
];

const DEFAULT_TRANCHES = [
  { label: "ไม้ 1", pct: 15, color: "#00d4aa" },
  { label: "ไม้ 2", pct: 35, color: "#f59e0b" },
  { label: "ไม้ 3", pct: 50, color: "#ef4444" },
];

const fmt = (n) => n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pctFmt = (n) => `${n.toFixed(2)}%`;

// ─── NumberInput (ปรับปรุงใหม่: เอาปุ่มออกและขยายช่อง) ──────────────────────────
function NumberInput({ value, onChange, prefix, suffix, textAlign = "left" }) {
  return (
    <div className="input-field-container">
      {prefix && <span className="input-affix">{prefix}</span>}
      <input
        type="number"
        value={value === 0 ? "" : value}
        placeholder="0"
        onChange={(e) => onChange(parseFloat(e.target.value) || 0)}
        style={{ textAlign }}
      />
      {suffix && <span className="input-affix">{suffix}</span>}
    </div>
  );
}

function App() {
  // 💾 State Management
  const [initial, setInitial] = useState(() => Number(localStorage.getItem("dca_initial")) || 70000);
  const [added, setAdded] = useState(() => Number(localStorage.getItem("dca_added")) || 0);
  const [assets, setAssets] = useState(() => {
    const saved = localStorage.getItem("dca_assets");
    return saved ? JSON.parse(saved) : DEFAULT_ASSETS;
  });
  const [tranches, setTranches] = useState(() => {
    const saved = localStorage.getItem("dca_tranches");
    return saved ? JSON.parse(saved) : DEFAULT_TRANCHES;
  });

  const [newName, setNewName] = useState("");
  const [newPct, setNewPct] = useState(5);
  const [selectedAsset, setSelectedAsset] = useState(null);
  const [activeTab, setActiveTab] = useState("tracker");

  useEffect(() => {
    localStorage.setItem("dca_initial", initial);
    localStorage.setItem("dca_added", added);
    localStorage.setItem("dca_assets", JSON.stringify(assets));
    localStorage.setItem("dca_tranches", JSON.stringify(tranches));
  }, [initial, added, assets, tranches]);

  // Calculations
  const totalCapital = initial + added;
  const totalAllocated = assets.reduce((s, a) => s + a.targetPct, 0);
  const enriched = useMemo(() =>
    assets.map((a) => {
      const quota = (totalCapital * a.targetPct) / 100;
      const remaining = quota - a.bought;
      const progress = quota > 0 ? Math.min((a.bought / quota) * 100, 100) : 0;
      return { ...a, quota, remaining, progress };
    }), [assets, totalCapital]
  );
  const totalBought = enriched.reduce((s, a) => s + a.bought, 0);
  const totalRemaining = totalCapital - totalBought;

  // Handlers
  const updateAsset = (id, field, value) => setAssets(prev => prev.map(a => a.id === id ? { ...a, [field]: value } : a));
  const addAsset = () => {
    if (!newName.trim()) return;
    setAssets(prev => [...prev, { id: Date.now(), name: newName.toUpperCase(), targetPct: newPct, bought: 0 }]);
    setNewName(""); setNewPct(5);
  };
  const removeAsset = (id) => { if (confirm("ลบสินทรัพย์นี้?")) setAssets(prev => prev.filter(a => a.id !== id)); };

  return (
    <div className="container">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0c0f; color: #e8eaf0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* ซ่อนปุ่มเพิ่มลดของช่อง Number */
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button {
          -webkit-appearance: none; margin: 0;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
        
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; }
        .header h1 { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 800; }
        .header .sub { font-size: 11px; color: #5a6070; text-transform: uppercase; letter-spacing: 1.5px; }
        .pro-badge { background: #00d4aa15; border: 1px solid #00d4aa40; color: #00d4aa; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }

        .tabs { display: flex; background: #111318; padding: 4px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #1f2430; }
        .tab { flex: 1; padding: 12px; border-radius: 10px; border: none; background: transparent; color: #5a6070; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .tab.active { background: #181c23; color: #00d4aa; border: 1px solid #2a3040; }

        .card { background: #111318; border: 1px solid #1f2430; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .card-title { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700; color: #5a6070; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .card-title::after { content: ''; flex: 1; height: 1px; background: #1f2430; }

        /* การตั้งค่า Input ช่องกรอก */
        .input-field-container { display: flex; align-items: center; background: #181c23; border: 1px solid #2a3040; border-radius: 10px; overflow: hidden; height: 44px; width: 100%; }
        .input-field-container:focus-within { border-color: #00d4aa; }
        .input-field-container input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; font-weight: 600; padding: 0 12px; width: 100%; }
        .input-affix { color: #5a6070; font-size: 13px; font-weight: 600; padding: 0 12px; background: #111318; height: 100%; display: flex; align-items: center; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #111318; border: 1px solid #1f2430; padding: 15px; border-radius: 14px; }
        .stat-label { font-size: 9px; color: #5a6070; text-transform: uppercase; margin-bottom: 6px; }
        .stat-value { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; }

        .asset-row { background: #181c23; border: 1px solid #1f2430; border-radius: 14px; padding: 16px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .asset-row:hover { border-color: #2a3040; }
        .asset-row.selected { border-color: #00d4aa; background: #00d4aa08; }
        .asset-grid { display: grid; grid-template-columns: 80px 80px 1fr; gap: 12px; align-items: end; }
        .asset-name { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 8px; }
        
        .progress-bar { height: 4px; background: #111318; border-radius: 4px; margin-top: 12px; overflow: hidden; }
        .progress-fill { height: 100%; transition: width 0.5s; }

        .btn { padding: 12px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-primary { background: #00d4aa; color: #000; }
        .btn-del { color: #5a6070; background: transparent; font-size: 20px; }
        .btn-del:hover { color: #ef4444; }

        .tranche-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .tranche-item { background: #111318; border: 1px solid #1f2430; border-radius: 10px; padding: 12px; text-align: center; }
        .tranche-item .t-amt { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; margin-top: 4px; }
      `}</style>

      <div className="header">
        <div>
          <div style={{display:'flex', alignItems:'center', gap:'8px'}}>
            <h1>DCA Tracker</h1>
            <span className="pro-badge">PRO</span>
          </div>
          <div className="sub">Dollar Cost Averaging Portfolio</div>
        </div>
        <div style={{color: '#00d4aa', fontSize: '10px', fontWeight: '800'}}>AUTO-SAVING ✓</div>
      </div>

      <div className="tabs">
        <button className={`tab ${activeTab === "tracker" ? "active" : ""}`} onClick={() => setActiveTab("tracker")}>📊 Quota Tracker</button>
        <button className={`tab ${activeTab === "tranche" ? "active" : ""}`} onClick={() => setActiveTab("tranche")}>🎯 คำนวณไม้ DCA</button>
      </div>

      {/* 💳 Master Cash Pool */}
      <div className="card">
        <div className="card-title">💰 Master Cash Pool</div>
        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px'}}>
          <div>
            <div style={{fontSize: '10px', color: '#5a6070', marginBottom: '6px', textTransform: 'uppercase'}}>ทุนตั้งต้น</div>
            <NumberInput value={initial} onChange={setInitial} prefix="฿" />
          </div>
          <div>
            <div style={{fontSize: '10px', color: '#5a6070', marginBottom: '6px', textTransform: 'uppercase'}}>เงินที่เติมเพิ่ม</div>
            <NumberInput value={added} onChange={setAdded} prefix="฿" />
          </div>
        </div>
        <div style={{marginTop: '15px', padding: '15px', background: '#00d4aa10', borderRadius: '12px', border: '1px solid #00d4aa30', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
          <div style={{fontSize: '12px', color: '#00d4aa', fontWeight: '700'}}>เงินทุนรวมทั้งหมด</div>
          <div style={{fontSize: '22px', fontWeight: '800', color: '#00d4aa'}}>฿{fmt(totalCapital)}</div>
        </div>
      </div>

      {activeTab === "tracker" ? (
        <>
          <div className="stats-grid">
            <div className="stat-box">
              <div className="stat-label">ซื้อไปแล้ว</div>
              <div className="stat-value" style={{color: '#f59e0b'}}>฿{fmt(totalBought)}</div>
            </div>
            <div className="stat-box">
              <div className="stat-label">กระสุนเหลือ</div>
              <div className="stat-value" style={{color: '#00d4aa'}}>฿{fmt(totalRemaining)}</div>
            </div>
            <div className="stat-box">
              <div className="stat-label">ALLOC รวม</div>
              <div className="stat-value" style={{color: totalAllocated === 100 ? '#22c55e' : '#ef4444'}}>{pctFmt(totalAllocated)}</div>
            </div>
          </div>

          <div style={{marginBottom: '8px', display: 'flex', justifyContent: 'space-between', fontSize: '10px', color: '#5a6070', padding: '0 5px'}}>
            <span>สินทรัพย์ / เป้าหมาย %</span>
            <span>ยอดซื้อแล้ว / โควตาคงเหลือ</span>
          </div>

          {enriched.map(a => (
            <div key={a.id} className={`asset-row ${selectedAsset === a.id ? "selected" : ""}`} onClick={() => setSelectedAsset(selectedAsset === a.id ? null : a.id)}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start'}}>
                <div className="asset-name">{a.name}</div>
                <button className="btn-del" onClick={e => { e.stopPropagation(); removeAsset(a.id); }}>×</button>
              </div>
              
              <div className="asset-grid">
                <div onClick={e => e.stopPropagation()}>
                   <div style={{fontSize: '9px', color: '#5a6070', marginBottom: '4px'}}>เป้าหมาย</div>
                   <NumberInput value={a.targetPct} onChange={v => updateAsset(a.id, "targetPct", v)} suffix="%" textAlign="center" />
                </div>
                <div onClick={e => e.stopPropagation()}>
                   <div style={{fontSize: '9px', color: '#5a6070', marginBottom: '4px'}}>ซื้อแล้ว</div>
                   <NumberInput value={a.bought} onChange={v => updateAsset(a.id, "bought", v)} prefix="฿" textAlign="center" />
                </div>
                <div style={{textAlign: 'right'}}>
                   <div style={{fontSize: '9px', color: '#5a6070', marginBottom: '4px'}}>โควตา ฿{fmt(a.quota)}</div>
                   <div style={{fontSize: '15px', fontWeight: '800', color: a.remaining <= 0 ? '#22c55e' : '#ef4444'}}>
                     {a.remaining <= 0 ? "✓ FULL" : `฿${fmt(a.remaining)}`}
                   </div>
                </div>
              </div>

              <div className="progress-bar">
                <div className="progress-fill" style={{ width: `${a.progress}%`, background: a.progress >= 100 ? '#22c55e' : '#00d4aa' }} />
              </div>

              {selectedAsset === a.id && (
                <div className="tranche-grid" onClick={e => e.stopPropagation()}>
                  {tranches.map(t => (
                    <div key={t.label} className="tranche-item" style={{borderColor: t.color + '40'}}>
                      <div style={{fontSize: '10px', color: t.color, fontWeight: '700'}}>{t.label}</div>
                      <div className="t-amt" style={{color: t.color}}>฿{fmt(Math.max((a.remaining * t.pct) / 100, 0))}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}

          <div className="card" style={{marginTop: '20px'}}>
            <div className="card-title">➕ เพิ่มหุ้นใหม่</div>
            <div style={{display: 'flex', gap: '10px'}}>
              <input className="input-field-container" style={{padding: '0 15px', width: '60%'}} placeholder="Ticker (e.g. TSLA)" value={newName} onChange={e => setNewName(e.target.value)} />
              <div style={{width: '40%'}}><NumberInput value={newPct} onChange={setNewPct} suffix="%" textAlign="center" /></div>
            </div>
            <button className="btn btn-primary" style={{width: '100%', marginTop: '12px'}} onClick={addAsset}>เพิ่มลงพอร์ต</button>
          </div>
        </>
      ) : (
        <>
          <div className="card">
            <div className="card-title">⚙️ ตั้งค่าไม้ DCA</div>
            <div style={{display: 'flex', gap: '10px'}}>
              {tranches.map((t, i) => (
                <div key={i} style={{flex: 1}}>
                  <label style={{fontSize: '10px', color: t.color, fontWeight: '800', marginBottom: '5px', display: 'block'}}>{t.label}</label>
                  <NumberInput value={t.pct} onChange={v => {
                    const next = [...tranches];
                    next[i].pct = v;
                    setTranches(next);
                  }} suffix="%" textAlign="center" />
                </div>
              ))}
            </div>
          </div>

          <div className="card" style={{background: '#00d4aa05'}}>
            <div className="card-title">🎯 สรุปยอดซื้อแต่ละไม้ (จากทุนที่เหลือ)</div>
            <div className="tranche-grid">
              {tranches.map(t => (
                <div key={t.label} className="tranche-item" style={{background: '#111318', padding: '18px', borderColor: t.color}}>
                  <div style={{fontSize: '12px', color: t.color, fontWeight: '800'}}>{t.label} ({t.pct}%)</div>
                  <div style={{fontSize: '20px', fontWeight: '800', color: t.color, marginTop: '8px'}}>฿{fmt((totalRemaining * t.pct) / 100)}</div>
                </div>
              ))}
            </div>
            <div style={{textAlign: 'center', fontSize: '10px', color: '#5a6070', marginTop: '15px'}}>คำนวณจากกระสุนที่เหลือ ฿{fmt(totalRemaining)}</div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
