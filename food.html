<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Food Cost - Powered by Supabase</title>
    <link rel="apple-touch-icon" href="https://emojicdn.elk.sh/🍜">
    <link rel="icon" href="https://emojicdn.elk.sh/🍜">
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="error-log" style="color: #ff6b6b; padding: 20px; font-family: sans-serif; display: none; background: #2a0808; height: 100vh;"></div>
    <div id="root"></div>

    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('error-log').style.display = 'block';
            document.getElementById('error-log').innerText = 'แอปสะดุด! บั๊กคือ: ' + e.message;
        });
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const FONTS = "@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');";

        const supabaseUrl = 'https://edbaanbbnfegwbtfnoyd.supabase.co';
        const supabaseKey = 'sb_publishable_EJFrTEJsUDQjmiy6mpVTNg_b-teNlys';
        
        if (!window.supabase) {
            throw new Error("โหลด Supabase ไม่สำเร็จ ลองรีเฟรชหรือเช็คอินเทอร์เน็ตครับ");
        }
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        const CATEGORIES = ["โปรตีน", "ผัก", "เครื่องปรุง", "ของแห้ง", "นม/ไข่", "อื่นๆ"];
        const CAT_COLORS = { "โปรตีน": "#f97316", "ผัก": "#22c55e", "เครื่องปรุง": "#f59e0b", "ของแห้ง": "#a78bfa", "นม/ไข่": "#38bdf8", "อื่นๆ": "#94a3b8" };

        function calcCostPerUnit(ing) {
            return (ing.purchasePrice / ing.conversionFactor) / (ing.yieldPct / 100);
        }

        function calcRecipeCost(recipe, ingredients) {
            if(!recipe.items) return 0;
            return recipe.items.reduce((sum, item) => {
                const ing = ingredients.find(i => i.id === item.ingredientId);
                if (!ing) return sum;
                return sum + calcCostPerUnit(ing) * item.qty;
            }, 0);
        }

        function fcColor(pct) {
            if (pct <= 30) return "#22c55e";
            if (pct <= 38) return "#f59e0b";
            return "#ef4444";
        }

        function fcBg(pct) {
            if (pct <= 30) return "rgba(34,197,94,0.12)";
            if (pct <= 38) return "rgba(245,158,11,0.12)";
            return "rgba(239,68,68,0.12)";
        }

        // ─── COMPONENTS ─────────────────────────────────────────────────────────────
        
        function SearchableSelect({ options, value, onChange }) {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState("");
            const wrapperRef = useRef(null);

            const selectedOption = options.find(o => o.id === parseInt(value));

            useEffect(() => {
                function handleClickOutside(event) {
                    if (wrapperRef.current && !wrapperRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                }
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const filteredOptions = options.filter(o => o.name.toLowerCase().includes(search.toLowerCase()));

            return (
                <div ref={wrapperRef} style={{ position: "relative", width: "100%" }}>
                    <div
                        onClick={() => setIsOpen(!isOpen)}
                        style={{
                            background: "#1a1a2e", border: "1px solid #2a2a45", borderRadius: 8, padding: "0.5rem 0.75rem",
                            color: selectedOption ? "#f1f5f9" : "#6b7280", fontSize: "0.82rem", fontFamily: "'Sora', sans-serif",
                            cursor: "pointer", display: "flex", justify-content: "space-between", align-items: "center"
                        }}
                    >
                        <span style={{ whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                            {selectedOption ? `${selectedOption.name} (${selectedOption.recipeUnit})` : "ค้นหาวัตถุดิบ..."}
                        </span>
                        <span style={{ fontSize: "0.6rem", color: "#6b7280" }}>▼</span>
                    </div>

                    {isOpen && (
                        <div style={{
                            position: "absolute", bottom: "100%", left: 0, right: 0, marginBottom: "4px",
                            background: "#12121f", border: "1px solid #f59e0b", borderRadius: 8, zIndex: 50,
                            boxShadow: "0 -10px 30px rgba(0,0,0,0.8)", display: "flex", flexDirection: "column"
                        }}>
                            <input
                                autoFocus
                                placeholder="พิมพ์ชื่อเพื่อค้นหา..."
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                style={{
                                    background: "transparent", border: "none", borderBottom: "1px solid #2a2a45",
                                    padding: "0.75rem", color: "#f1f5f9", fontSize: "0.85rem", outline: "none", width: "100%", fontFamily: "'Sora', sans-serif"
                                }}
                            />
                            <div style={{ maxHeight: "200px", overflowY: "auto" }}>
                                {filteredOptions.length === 0 && <div style={{ padding: "1rem", color: "#6b7280", fontSize: "0.8rem", textAlign: "center" }}>ไม่พบวัตถุดิบนี้</div>}
                                {filteredOptions.map(o => (
                                    <div
                                        key={o.id}
                                        onClick={() => {
                                            onChange(o.id);
                                            setIsOpen(false);
                                            setSearch("");
                                        }}
                                        style={{
                                            padding: "0.6rem 0.75rem", fontSize: "0.82rem", color: value == o.id ? "#f59e0b" : "#e2e8f0", cursor: "pointer",
                                            background: value == o.id ? "rgba(245,158,11,0.1)" : "transparent",
                                            borderLeft: value == o.id ? "3px solid #f59e0b" : "3px solid transparent"
                                        }}
                                    >
                                        {o.name} <span style={{ color: "#6b7280", fontSize: "0.7rem" }}>({o.recipeUnit})</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function StatCard({ label, value, sub, accent }) {
            return (
                <div style={{ background: "#1a1a2e", border: "1px solid #2a2a45", borderRadius: 12, padding: "1.25rem 1.5rem", position: "relative", overflow: "hidden" }}>
                    <div style={{ position: "absolute", top: 0, left: 0, width: 3, height: "100%", background: accent, borderRadius: "3px 0 0 3px" }} />
                    <div style={{ fontSize: "0.7rem", color: "#6b7280", letterSpacing: "0.1em", textTransform: "uppercase", fontFamily: "'JetBrains Mono', monospace", marginBottom: 8 }}>{label}</div>
                    <div style={{ fontSize: "1.8rem", fontWeight: 700, color: "#f1f5f9", lineHeight: 1 }}>{value}</div>
                    {sub && <div style={{ fontSize: "0.75rem", color: accent, marginTop: 6, fontFamily: "'JetBrains Mono', monospace" }}>{sub}</div>}
                </div>
            );
        }

        function Modal({ title, onClose, children }) {
            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                    <div className="bg-[#12121f] border border-[#2a2a45] rounded-2xl w-full max-w-[520px] max-h-[85vh] overflow-auto shadow-2xl">
                        <div className="p-4 md:p-5 border-b border-[#1e1e35] flex items-center justify-between sticky top-0 bg-[#12121f] z-10">
                            <div className="font-semibold text-[1rem] text-[#f1f5f9]">{title}</div>
                            <button onClick={onClose} className="bg-[#1e1e35] border-none text-[#94a3b8] w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer text-lg">×</button>
                        </div>
                        <div className="p-4 md:p-6">{children}</div>
                    </div>
                </div>
            );
        }

        function Input({ label, ...props }) {
            return (
                <div className="mb-3.5">
                    {label && <div className="text-[0.72rem] text-[#94a3b8] mb-1.5 tracking-wide">{label}</div>}
                    <input {...props} className="w-full bg-[#1a1a2e] border border-[#2a2a45] rounded-lg py-2.5 px-3 text-[#f1f5f9] text-[0.85rem] font-['Sora'] outline-none focus:border-[#f59e0b] focus:ring-1 focus:ring-[#f59e0b] transition-all" />
                </div>
            );
        }

        function Select({ label, children, ...props }) {
            return (
                <div className="mb-3.5">
                    {label && <div className="text-[0.72rem] text-[#94a3b8] mb-1.5 tracking-wide">{label}</div>}
                    <select {...props} className="w-full bg-[#1a1a2e] border border-[#2a2a45] rounded-lg py-2.5 px-3 text-[#f1f5f9] text-[0.85rem] font-['Sora'] outline-none focus:border-[#f59e0b] focus:ring-1 focus:ring-[#f59e0b] transition-all appearance-none">
                        {children}
                    </select>
                </div>
            );
        }

        function Btn({ children, onClick, variant = "primary", style = {}, className = "" }) {
            const base = "border-none rounded-lg py-2.5 px-5 cursor-pointer font-['Sora'] font-semibold text-[0.82rem] transition-all active:scale-95 flex justify-center items-center ";
            const variants = {
                primary: "bg-gradient-to-br from-[#f59e0b] to-[#f97316] text-[#0f0f1a] shadow-lg shadow-orange-500/20",
                ghost: "bg-[#1e1e35] text-[#94a3b8] border border-[#2a2a45]",
                danger: "bg-red-500/10 text-red-500 border border-red-500/30",
            };
            return <button onClick={onClick} className={base + variants[variant] + " " + className} style={style}>{children}</button>;
        }

        // ─── PAGES ──────────────────────────────────────────────────────────────────

        function Dashboard({ ingredients, recipes, menu }) {
            const menuWithCosts = menu.map(item => {
                const recipe = recipes.find(r => r.id === item.recipeId);
                const cost = recipe ? calcRecipeCost(recipe, ingredients) / recipe.servings : 0;
                const pct = item.price > 0 ? (cost / item.price) * 100 : 0;
                return { ...item, cost, pct };
            });
            const avgFc = menuWithCosts.length ? menuWithCosts.reduce((s, i) => s + i.pct, 0) / menuWithCosts.length : 0;
            const highFcItems = menuWithCosts.filter(i => i.pct > 38).length;
            const topCostIng = [...ingredients].sort((a, b) => calcCostPerUnit(b) - calcCostPerUnit(a)).slice(0, 5);

            return (
                <div className="pb-10">
                    <div className="mb-6">
                        <div className="text-2xl font-bold text-[#f1f5f9] mb-1">Overview</div>
                        <div className="text-sm text-[#6b7280]">ภาพรวม Food Cost ของร้านคุณ</div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-8">
                        <StatCard label="Avg Food Cost" value={`${avgFc.toFixed(1)}%`} sub={avgFc === 0 ? "เพิ่มเมนูก่อน" : avgFc <= 35 ? "✓ อยู่ในเกณฑ์ดี" : "⚠ สูงเกินเกณฑ์"} accent={avgFc <= 35 ? "#22c55e" : "#ef4444"} />
                        <StatCard label="เมนูทั้งหมด" value={menu.length} sub={`${highFcItems} เมนูต้นทุนสูง`} accent="#f59e0b" />
                        <StatCard label="วัตถุดิบ" value={ingredients.length} sub="รายการในระบบ" accent="#38bdf8" />
                        <StatCard label="สูตรอาหาร" value={recipes.length} sub="recipe ทั้งหมด" accent="#a78bfa" />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                        <div className="bg-[#1a1a2e] border border-[#2a2a45] rounded-xl p-4 md:p-5">
                            <div className="text-xs text-[#94a3b8] mb-4 tracking-widest uppercase">Food Cost % รายเมนู</div>
                            {menuWithCosts.length === 0 && <div className="text-[#6b7280] text-sm">ยังไม่มีข้อมูลเมนู</div>}
                            {menuWithCosts.map(item => (
                                <div key={item.id} className="flex items-center gap-3 mb-3">
                                    <div className="flex-1 text-sm text-[#e2e8f0] truncate">{item.name}</div>
                                    <div className="w-[60px] md:w-[100px] hidden sm:block">
                                        <div className="h-1.5 bg-[#2a2a45] rounded-full">
                                            <div className="h-full rounded-full transition-all duration-500" style={{ width: `${Math.min(item.pct, 100)}%`, background: fcColor(item.pct) }} />
                                        </div>
                                    </div>
                                    <div className="text-[0.78rem] font-['JetBrains_Mono'] text-right font-semibold w-[45px]" style={{ color: fcColor(item.pct) }}>{item.pct.toFixed(1)}%</div>
                                </div>
                            ))}
                        </div>

                        <div className="bg-[#1a1a2e] border border-[#2a2a45] rounded-xl p-4 md:p-5">
                            <div className="text-xs text-[#94a3b8] mb-4 tracking-widest uppercase">Top 5 วัตถุดิบต้นทุนสูง</div>
                            {topCostIng.length === 0 && <div className="text-[#6b7280] text-sm">ยังไม่มีข้อมูลวัตถุดิบ</div>}
                            {topCostIng.map((ing, i) => (
                                <div key={ing.id} className="flex items-center gap-3 mb-3">
                                    <div className="w-6 h-6 rounded bg-[#2a2a45] flex items-center justify-center text-[0.65rem] font-['JetBrains_Mono'] text-[#94a3b8] flex-shrink-0">{i + 1}</div>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-sm text-[#e2e8f0] truncate">{ing.name}</div>
                                        <div className="text-[0.68rem] text-[#6b7280]">{ing.category}</div>
                                    </div>
                                    <div className="text-[0.78rem] font-['JetBrains_Mono'] text-[#f59e0b] font-semibold whitespace-nowrap">฿{calcCostPerUnit(ing).toFixed(2)}/{ing.recipeUnit}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function IngredientsPage({ ingredients, setIngredients }) {
            const [showModal, setShowModal] = useState(false);
            const [editItem, setEditItem] = useState(null);
            const [filter, setFilter] = useState("ทั้งหมด");
            const [form, setForm] = useState({ name: "", category: "โปรตีน", purchaseUnit: "kg", purchasePrice: "", recipeUnit: "g", conversionFactor: "1000", yieldPct: "100" });

            function openAdd() { setForm({ name: "", category: "โปรตีน", purchaseUnit: "kg", purchasePrice: "", recipeUnit: "g", conversionFactor: "1000", yieldPct: "100" }); setEditItem(null); setShowModal(true); }
            function openEdit(ing) { setForm({ ...ing, purchasePrice: String(ing.purchasePrice), conversionFactor: String(ing.conversionFactor), yieldPct: String(ing.yieldPct) }); setEditItem(ing.id); setShowModal(true); }

            async function save() {
                const data = { 
                    name: form.name, category: form.category, purchaseUnit: form.purchaseUnit, 
                    purchasePrice: parseFloat(form.purchasePrice), recipeUnit: form.recipeUnit, 
                    conversionFactor: parseFloat(form.conversionFactor), yieldPct: parseFloat(form.yieldPct) 
                };
                
                if (editItem) {
                    const { data: updated } = await supabaseClient.from('ingredients').update(data).eq('id', editItem).select().single();
                    if(updated) setIngredients(prev => prev.map(i => i.id === editItem ? updated : i));
                } else {
                    const { data: inserted } = await supabaseClient.from('ingredients').insert([data]).select().single();
                    if(inserted) setIngredients(prev => [...prev, inserted]);
                }
                setShowModal(false);
            }

            async function del(id) { 
                if(!confirm("ต้องการลบวัตถุดิบนี้จริงๆ หรือไม่?")) return;
                await supabaseClient.from('ingredients').delete().eq('id', id);
                setIngredients(prev => prev.filter(i => i.id !== id)); 
            }

            const filtered = filter === "ทั้งหมด" ? ingredients : ingredients.filter(i => i.category === filter);

            return (
                <div className="pb-10">
                    <div className="flex items-center justify-between mb-6">
                        <div>
                            <div className="text-2xl font-bold text-[#f1f5f9]">วัตถุดิบ</div>
                            <div className="text-sm text-[#6b7280]">{ingredients.length} รายการ</div>
                        </div>
                        <Btn onClick={openAdd}>+ เพิ่ม</Btn>
                    </div>

                    <div className="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide" style={{ WebkitOverflowScrolling: "touch" }}>
                        {["ทั้งหมด", ...CATEGORIES].map(cat => (
                            <button key={cat} onClick={() => setFilter(cat)} 
                                className={`px-3 py-1.5 rounded-full border text-xs whitespace-nowrap transition-all ${filter === cat ? 'border-[#f59e0b] bg-[#f59e0b]/10 text-[#f59e0b]' : 'border-[#2a2a45] bg-transparent text-[#6b7280]'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>

                    <div className="bg-[#1a1a2e] border border-[#2a2a45] rounded-xl overflow-hidden">
                        <div className="overflow-x-auto" style={{ WebkitOverflowScrolling: "touch" }}>
                            <table className="w-full text-left min-w-[650px] border-collapse">
                                <thead>
                                    <tr className="border-b border-[#2a2a45] bg-[#12121f]/50">
                                        <th className="p-3 md:p-4 text-[0.7rem] text-[#6b7280] font-medium tracking-wide uppercase">ชื่อวัตถุดิบ</th>
                                        <th className="p-3 md:p-4 text-[0.7rem] text-[#6b7280] font-medium tracking-wide uppercase">หมวด</th>
                                        <th className="p-3 md:p-4 text-[0.7rem] text-[#6b7280] font-medium tracking-wide uppercase">ราคาซื้อ</th>
                                        <th className="p-3 md:p-4 text-[0.7rem] text-[#6b7280] font-medium tracking-wide uppercase">Yield</th>
                                        <th className="p-3 md:p-4 text-[0.7rem] text-[#6b7280] font-medium tracking-wide uppercase">ต้นทุน/หน่วย</th>
                                        <th className="p-3 md:p-4"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.length === 0 && (
                                        <tr><td colSpan="6" className="text-center p-8 text-[#6b7280] text-sm">ยังไม่มีข้อมูล - กดเพิ่มวัตถุดิบเลย!</td></tr>
                                    )}
                                    {filtered.map(ing => {
                                        const cpu = calcCostPerUnit(ing);
                                        return (
                                            <tr key={ing.id} className="border-b border-[#1e1e35] hover:bg-[#1e1e35]/50 transition-colors">
                                                <td className="p-3 md:p-4 text-[#f1f5f9] text-sm font-medium">{ing.name}</td>
                                                <td className="p-3 md:p-4">
                                                    <span className="rounded-md px-2 py-1 text-[0.65rem] font-semibold border" style={{ background: `${CAT_COLORS[ing.category]}15`, color: CAT_COLORS[ing.category], borderColor: `${CAT_COLORS[ing.category]}30` }}>
                                                        {ing.category}
                                                    </span>
                                                </td>
                                                <td className="p-3 md:p-4 text-[#e2e8f0] text-[0.8rem] font-['JetBrains_Mono']">฿{ing.purchasePrice}/{ing.purchaseUnit}</td>
                                                <td className="p-3 md:p-4">
                                                    <span className="font-['JetBrains_Mono'] text-[0.8rem]" style={{ color: ing.yieldPct >= 90 ? "#22c55e" : "#f59e0b" }}>{ing.yieldPct}%</span>
                                                </td>
                                                <td className="p-3 md:p-4 text-[#f59e0b] font-['JetBrains_Mono'] text-[0.8rem] font-semibold">฿{cpu.toFixed(4)}<span className="text-[#6b7280] text-[0.7rem]">/{ing.recipeUnit}</span></td>
                                                <td className="p-3 md:p-4">
                                                    <div className="flex gap-2 justify-end">
                                                        <button onClick={() => openEdit(ing)} className="bg-[#2a2a45] text-[#94a3b8] rounded px-2.5 py-1 text-xs active:scale-95">แก้ไข</button>
                                                        <button onClick={() => del(ing.id)} className="bg-red-500/10 text-red-500 rounded px-2.5 py-1 text-xs active:scale-95">ลบ</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showModal && (
                        <Modal title={editItem ? "แก้ไขวัตถุดิบ" : "เพิ่มวัตถุดิบใหม่"} onClose={() => setShowModal(false)}>
                            <Input label="ชื่อวัตถุดิบ" value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} placeholder="เช่น หมูสับ, ไข่ไก่" />
                            <Select label="หมวดหมู่" value={form.category} onChange={e => setForm(p => ({ ...p, category: e.target.value }))}>
                                {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                            </Select>
                            <div className="grid grid-cols-2 gap-3">
                                <Input label="ราคาซื้อ (บาท)" type="number" value={form.purchasePrice} onChange={e => setForm(p => ({ ...p, purchasePrice: e.target.value }))} placeholder="0" />
                                <Input label="หน่วยที่ซื้อ" value={form.purchaseUnit} onChange={e => setForm(p => ({ ...p, purchaseUnit: e.target.value }))} placeholder="kg, แพ็ค" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <Input label="หน่วยในสูตร" value={form.recipeUnit} onChange={e => setForm(p => ({ ...p, recipeUnit: e.target.value }))} placeholder="g, ml, ฟอง" />
                                <Input label="Conversion Factor" type="number" value={form.conversionFactor} onChange={e => setForm(p => ({ ...p, conversionFactor: e.target.value }))} placeholder="1000" />
                            </div>
                            <Input label="Yield % (ส่วนที่ใช้ได้จริง)" type="number" value={form.yieldPct} onChange={e => setForm(p => ({ ...p, yieldPct: e.target.value }))} placeholder="100" />

                            {form.purchasePrice && form.conversionFactor && form.yieldPct && (
                                <div className="bg-[#f59e0b]/10 border border-[#f59e0b]/30 rounded-lg p-3 md:p-4 mb-4 text-sm flex justify-between items-center">
                                    <span className="text-[#94a3b8]">ต้นทุนต่อหน่วย: </span>
                                    <span className="text-[#f59e0b] font-['JetBrains_Mono'] font-bold text-lg">
                                        ฿{((parseFloat(form.purchasePrice) / parseFloat(form.conversionFactor)) / (parseFloat(form.yieldPct) / 100)).toFixed(4)} <span className="text-xs text-[#94a3b8] font-sans font-normal">/ {form.recipeUnit || "หน่วย"}</span>
                                    </span>
                                </div>
                            )}

                            <div className="flex gap-2 justify-end mt-2">
                                <Btn variant="ghost" onClick={() => setShowModal(false)} className="flex-1 md:flex-none">ยกเลิก</Btn>
                                <Btn onClick={save} className="flex-1 md:flex-none">{editItem ? "บันทึก" : "เพิ่มวัตถุดิบ"}</Btn>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        function RecipesPage({ ingredients, recipes, setRecipes }) {
            const [selected, setSelected] = useState(recipes[0]?.id || null);
            const [showNew, setShowNew] = useState(false);
            const [newName, setNewName] = useState("");
            const [addIngId, setAddIngId] = useState("");
            const [addQty, setAddQty] = useState("100");

            useEffect(() => {
                if(ingredients.length > 0 && !addIngId) setAddIngId(ingredients[0].id);
                if(recipes.length > 0 && !selected) setSelected(recipes[0].id);
            }, [ingredients, recipes]);

            const recipe = recipes.find(r => r.id === selected);
            const totalCost = recipe ? calcRecipeCost(recipe, ingredients) / recipe.servings : 0;

            async function createRecipe() {
                if (!newName.trim()) return;
                const { data: inserted } = await supabaseClient.from('recipes').insert([{ name: newName, servings: 1 }]).select().single();
                if(inserted) {
                    const r = { ...inserted, items: [] };
                    setRecipes(prev => [...prev, r]);
                    setSelected(r.id);
                }
                setShowNew(false);
                setNewName("");
            }

            async function addItem() {
                const id = parseInt(addIngId);
                const qty = parseFloat(addQty);
                if (!id || !qty) return;
                
                const existing = recipe.items.find(i => i.ingredientId === id);
                if(existing) {
                    const { data } = await supabaseClient.from('recipe_items').update({ qty: existing.qty + qty }).eq('id', existing.id).select().single();
                    if(data) setRecipes(prev => prev.map(r => r.id === selected ? { ...r, items: r.items.map(i => i.id === data.id ? data : i) } : r));
                } else {
                    const { data } = await supabaseClient.from('recipe_items').insert([{ recipeId: selected, ingredientId: id, qty }]).select().single();
                    if(data) setRecipes(prev => prev.map(r => r.id === selected ? { ...r, items: [...r.items, data] } : r));
                }
            }

            async function removeItem(riId) {
                await supabaseClient.from('recipe_items').delete().eq('id', riId);
                setRecipes(prev => prev.map(r => r.id === selected ? { ...r, items: r.items.filter(i => i.id !== riId) } : r));
            }

            async function updateQty(riId, val) {
                const qty = parseFloat(val) || 0;
                const { data } = await supabaseClient.from('recipe_items').update({ qty }).eq('id', riId).select().single();
                if(data) setRecipes(prev => prev.map(r => r.id === selected ? { ...r, items: r.items.map(i => i.id === riId ? data : i) } : r));
            }

            async function deleteRecipe() {
                if(!confirm("ต้องการลบสูตรอาหารนี้ใช่ไหม? (เมนูที่ผูกอยู่จะได้รับผลกระทบ)")) return;
                await supabaseClient.from('recipes').delete().eq('id', selected);
                setRecipes(prev => prev.filter(r => r.id !== selected));
                setSelected(null);
            }

            return (
                <div className="flex flex-col md:grid md:grid-cols-[250px_1fr] gap-4 md:gap-5 h-auto md:h-[calc(100vh-120px)] pb-10">
                    
                    <div className="bg-[#1a1a2e] border border-[#2a2a45] rounded-xl flex flex-col h-[250px] md:h-auto flex-shrink-0">
                        <div className="p-4 border-b border-[#2a2a45] text-xs text-[#6b7280] tracking-widest uppercase font-semibold flex justify-between items-center">
                            <span>สูตรอาหารทั้งหมด</span>
                            <span className="md:hidden text-[#f59e0b] bg-[#f59e0b]/10 px-2 py-0.5 rounded text-[0.6rem]">{recipes.length}</span>
                        </div>
                        <div className="flex-1 overflow-y-auto" style={{ WebkitOverflowScrolling: "touch" }}>
                            {recipes.length === 0 && <div className="p-4 text-[#6b7280] text-sm text-center">ยังไม่มีสูตรอาหาร</div>}
                            {recipes.map(r => {
                                const cost = calcRecipeCost(r, ingredients) / r.servings;
                                return (
                                    <div key={r.id} onClick={() => setSelected(r.id)} 
                                        className={`p-3 md:p-4 cursor-pointer border-b border-[#1e1e35] transition-colors border-l-4 ${selected === r.id ? 'bg-[#f59e0b]/10 border-l-[#f59e0b]' : 'border-l-transparent hover:bg-[#1e1e35]/50'}`}>
                                        <div className={`text-sm font-medium ${selected === r.id ? 'text-[#f59e0b]' : 'text-[#e2e8f0]'}`}>{r.name}</div>
                                        <div className="text-[0.7rem] text-[#6b7280] mt-1 font-['JetBrains_Mono']">฿{cost.toFixed(2)}/serving</div>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="p-3 bg-[#12121f] border-t border-[#2a2a45] rounded-b-xl">
                            {showNew ? (
                                <div className="flex flex-col gap-2">
                                    <input autoFocus value={newName} onChange={e => setNewName(e.target.value)} placeholder="ชื่อสูตรใหม่..." onKeyDown={e => e.key === "Enter" && createRecipe()} className="w-full bg-[#1a1a2e] border border-[#2a2a45] rounded-lg p-2 text-[#f1f5f9] text-sm font-['Sora'] outline-none focus:border-[#f59e0b]" />
                                    <div className="flex gap-2">
                                        <Btn onClick={createRecipe} className="flex-1 py-1.5 text-xs">บันทึก</Btn>
                                        <Btn variant="ghost" onClick={() => setShowNew(false)} className="py-1.5 px-3 text-xs">×</Btn>
                                    </div>
                                </div>
                            ) : (
                                <Btn onClick={() => setShowNew(true)} className="w-full py-2 border border-dashed border-[#f59e0b]/50 bg-transparent text-[#f59e0b]">+ สร้างสูตรใหม่</Btn>
                            )}
                        </div>
                    </div>

                    {recipe ? (
                        <div className="bg-[#1a1a2e] border border-[#2a2a45] rounded-xl flex flex-col min-h-[400px]">
                            <div className="p-4 md:p-5 border-b border-[#2a2a45] flex flex-col md:flex-row md:items-center justify-between gap-3">
                                <div>
                                    <div className="flex items-center gap-2">
                                        <div className="text-lg md:text-xl font-bold text-[#f1f5f9]">{recipe.name}</div>
                                        <button onClick={deleteRecipe} className="bg-red-500/10 text-red-500 p-1.5 rounded-md text-xs active:scale-95">🗑️</button>
                                    </div>
                                </div>
                                <div className="bg-[#12121f] px-4 py-2 rounded-lg border border-[#2a2a45] self-start md:self-auto">
                                    <div className="text-[0.65rem] text-[#6b7280] uppercase tracking-widest mb-0.5">ต้นทุนต่อ Serving</div>
                                    <div className="text-xl font-bold text-[#f59e0b] font-['JetBrains_Mono'] leading-none">฿{totalCost.toFixed(2)}</div>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto p-4 md:p-5" style={{ WebkitOverflowScrolling: "touch" }}>
                                {recipe.items.length === 0 && (
                                    <div className="text-center p-8 border-2 border-dashed border-[#2a2a45] rounded-xl text-[#6b7280] text-sm">สูตรว่างเปล่า — เพิ่มวัตถุดิบด้านล่างได้เลยครับเชฟ!</div>
                                )}
                                {recipe.items.map(item => {
                                    const ing = ingredients.find(i => i.id === item.ingredientId);
                                    if (!ing) return null;
                                    const lineCost = calcCostPerUnit(ing) * item.qty;
                                    return (
                                        <div key={item.id} className="flex items-center gap-3 py-3 border-b border-[#1e1e35] last:border-0">
                                            <div className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: CAT_COLORS[ing.category] }} />
                                            <div className="flex-1 min-w-0">
                                                <div className="text-sm text-[#e2e8f0] font-medium truncate">{ing.name}</div>
                                                <div className="text-[0.7rem] text-[#6b7280] font-['JetBrains_Mono']">฿{calcCostPerUnit(ing).toFixed(2)}/{ing.recipeUnit}</div>
                                            </div>
                                            <div className="flex items-center gap-1.5">
                                                <input type="number" value={item.qty} onChange={e => updateQty(item.id, e.target.value)} className="w-[60px] bg-[#12121f] border border-[#2a2a45] rounded-md py-1 px-2 text-[#f1f5f9] text-sm font-['JetBrains_Mono'] text-right focus:border-[#f59e0b] outline-none" />
                                                <span className="text-xs text-[#6b7280] w-5">{ing.recipeUnit}</span>
                                            </div>
                                            <div className="text-sm text-[#f59e0b] font-['JetBrains_Mono'] font-semibold w-[60px] text-right">฿{lineCost.toFixed(2)}</div>
                                            <button onClick={() => removeItem(item.id)} className="text-[#6b7280] hover:text-red-500 px-1 text-lg">×</button>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="p-4 bg-[#12121f] border-t border-[#2a2a45] rounded-b-xl">
                                <div className="flex flex-col md:flex-row gap-3 md:items-end">
                                    <div className="flex-1">
                                        <div className="text-[0.68rem] text-[#6b7280] mb-1.5">ค้นหาวัตถุดิบ</div>
                                        <SearchableSelect options={ingredients} value={addIngId} onChange={val => setAddIngId(val)} />
                                    </div>
                                    <div className="flex gap-3 items-end">
                                        <div className="w-[90px]">
                                            <div className="text-[0.68rem] text-[#6b7280] mb-1.5">ปริมาณ</div>
                                            <input type="number" value={addQty} onChange={e => setAddQty(e.target.value)} className="w-full bg-[#1a1a2e] border border-[#2a2a45] rounded-lg p-2 text-[#f1f5f9] text-sm font-['JetBrains_Mono'] outline-none focus:border-[#f59e0b]" />
                                        </div>
                                        <Btn onClick={addItem} className="h-[38px] px-6 whitespace-nowrap">+ ใส่หม้อ</Btn>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="hidden md:flex bg-[#1a1a2e] border border-dashed border-[#2a2a45] rounded-xl items-center justify-center text-[#6b7280] text-sm">
                            👈 เลือก หรือสร้างสูตรอาหารใหม่ด้านซ้ายมือครับ
                        </div>
                    )}
                </div>
            );
        }

        function MenuPage({ ingredients, recipes, menu, setMenu }) {
            const [showModal, setShowModal] = useState(false);
            // 🛠️ เพิ่ม state สำหรับ image_url
            const [form, setForm] = useState({ name: "", recipeId: "", price: "", image_url: "" });

            useEffect(() => {
                if(recipes.length > 0 && !form.recipeId) setForm(p => ({...p, recipeId: recipes[0].id}));
            }, [recipes]);

            const menuWithCosts = menu.map(item => {
                const recipe = recipes.find(r => r.id === item.recipeId);
                const cost = recipe ? calcRecipeCost(recipe, ingredients) / recipe.servings : 0;
                const pct = item.price > 0 ? (cost / item.price) * 100 : 0;
                const profit = item.price - cost;
                const suggested = cost > 0 ? cost / 0.32 : 0;
                return { ...item, cost, pct, profit, suggested };
            });

            async function save() {
                // 🛠️ บันทึก image_url ลงฐานข้อมูลด้วย
                const data = { 
                    name: form.name, 
                    recipeId: parseInt(form.recipeId), 
                    price: parseFloat(form.price),
                    image_url: form.image_url || null // ถ้าไม่ใส่ก็ให้เป็นค่าว่างไป
                };
                
                const { data: inserted } = await supabaseClient.from('menus').insert([data]).select().single();
                if(inserted) setMenu(prev => [...prev, inserted]);
                setShowModal(false);
                setForm({ name: "", recipeId: recipes[0]?.id || "", price: "", image_url: "" });
            }

            async function delMenu(id) {
                if(!confirm("ต้องการลบเมนูนี้ใช่ไหม?")) return;
                await supabaseClient.from('menus').delete().eq('id', id);
                setMenu(prev => prev.filter(m => m.id !== id));
            }

            const previewCost = (() => {
                const r = recipes.find(r => r.id === parseInt(form.recipeId));
                return r ? calcRecipeCost(r, ingredients) / r.servings : 0;
            })();
            const previewFc = form.price > 0 ? (previewCost / parseFloat(form.price)) * 100 : 0;

            return (
                <div className="pb-10">
                    <div className="flex items-center justify-between mb-6">
                        <div>
                            <div className="text-2xl font-bold text-[#f1f5f9]">เมนูหน้าร้าน</div>
                            <div className="text-sm text-[#6b7280]">ตั้งราคาและดู % กำไร</div>
                        </div>
                        <Btn onClick={() => setShowModal(true)}>+ เพิ่มเมนู</Btn>
                    </div>

                    <div className="grid gap-4">
                        {menuWithCosts.length === 0 && <div className="text-[#6b7280] text-center p-8 bg-[#1a1a2e] rounded-xl border border-dashed border-[#2a2a45]">ยังไม่มีข้อมูลเมนูหน้าร้าน</div>}
                        
                        {menuWithCosts.map(item => (
                            <div key={item.id} className="bg-[#1a1a2e] border border-[#2a2a45] rounded-xl p-4 md:p-5 flex flex-col md:flex-row md:items-center gap-4 md:gap-6 relative overflow-hidden">
                                
                                <div className="absolute left-0 top-0 bottom-0 w-1.5" style={{ background: fcColor(item.pct) }} />

                                {/* 🆕 ส่วนแสดงรูปภาพที่เพิ่มเข้ามาใหม่ (อยู่ด้านซ้ายของชื่อเมนู) */}
                                <div className="flex-1 pl-2 flex items-center gap-3">
                                    <div className="w-14 h-14 md:w-16 md:h-16 rounded-xl bg-[#12121f] border border-[#2a2a45] overflow-hidden flex-shrink-0 flex items-center justify-center">
                                        {item.image_url ? (
                                            <img src={item.image_url} alt={item.name} className="w-full h-full object-cover" />
                                        ) : (
                                            <span className="text-2xl opacity-40">🍲</span>
                                        )}
                                    </div>
                                    <div>
                                        <div className="text-base font-semibold text-[#f1f5f9] mb-1">{item.name}</div>
                                        <div className="text-[0.65rem] md:text-xs text-[#6b7280]">จากสูตร: {recipes.find(r => r.id === item.recipeId)?.name || "-"}</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-3 gap-2 md:gap-6 bg-[#12121f] md:bg-transparent p-3 md:p-0 rounded-lg border md:border-0 border-[#2a2a45]">
                                    <div className="text-center">
                                        <div className="text-[0.65rem] text-[#6b7280] uppercase mb-1">ต้นทุน</div>
                                        <div className="text-sm md:text-base font-semibold text-[#e2e8f0] font-['JetBrains_Mono']">฿{item.cost.toFixed(1)}</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-[0.65rem] text-[#6b7280] uppercase mb-1">ราคาขาย</div>
                                        <div className="text-sm md:text-base font-semibold text-[#38bdf8] font-['JetBrains_Mono']">฿{item.price.toFixed(0)}</div>
                                    </div>
                                    <div className="text-center">
                                        <div className="text-[0.65rem] text-[#6b7280] uppercase mb-1">กำไร</div>
                                        <div className="text-sm md:text-base font-semibold text-[#22c55e] font-['JetBrains_Mono']">฿{item.profit.toFixed(1)}</div>
                                    </div>
                                </div>

                                <div className="flex items-center justify-between md:justify-end gap-4 border-t md:border-0 border-[#2a2a45] pt-3 md:pt-0 pl-2 md:pl-0">
                                    <div className="text-center md:text-right flex items-center gap-3 md:block">
                                        <div className="text-[0.65rem] text-[#6b7280] uppercase mb-1 hidden md:block">Food Cost</div>
                                        <div className="px-3 py-1 rounded-lg border font-['JetBrains_Mono'] font-bold text-lg" 
                                             style={{ background: fcBg(item.pct), borderColor: `${fcColor(item.pct)}40`, color: fcColor(item.pct) }}>
                                            {item.pct.toFixed(1)}%
                                        </div>
                                    </div>

                                    <div className="w-[80px] md:w-[100px] hidden sm:block">
                                        <div className="flex justify-between text-[0.55rem] text-[#6b7280] mb-1"><span>0%</span><span>35%</span></div>
                                        <div className="h-2 bg-[#2a2a45] rounded-full relative">
                                            <div className="absolute left-[35%] top-[-2px] w-px h-3 bg-[#f59e0b] opacity-50" />
                                            <div className="h-full rounded-full" style={{ width: `${Math.min(item.pct * 2, 100)}%`, background: `linear-gradient(to right, #22c55e, ${fcColor(item.pct)})` }} />
                                        </div>
                                    </div>

                                    <button onClick={() => delMenu(item.id)} className="bg-red-500/10 text-red-500 rounded-lg p-2 md:px-3 md:py-1.5 text-xs active:scale-95">ลบ</button>
                                </div>
                            </div>
                        ))}
                    </div>

                    {showModal && (
                        <Modal title="เพิ่มเมนูใหม่" onClose={() => setShowModal(false)}>
                            <Input label="ชื่อเมนู (ที่แสดงหน้าร้าน)" value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} placeholder="เช่น ข้าวผัดกระเพรา + ไข่ดาว" />
                            <Select label="ดึงสูตรอาหารมาใช้" value={form.recipeId} onChange={e => setForm(p => ({ ...p, recipeId: e.target.value }))}>
                                {recipes.length === 0 && <option value="">กรุณาสร้างสูตรอาหารก่อน</option>}
                                {recipes.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                            </Select>
                            <Input label="ตั้งราคาขาย (บาท)" type="number" value={form.price} onChange={e => setForm(p => ({ ...p, price: e.target.value }))} placeholder="0" />
                            
                            {/* 🆕 ช่องให้กรอกลิงก์รูปภาพ */}
                            <Input label="ลิงก์รูปภาพ (Image URL - ใส่หรือไม่ใส่ก็ได้)" value={form.image_url} onChange={e => setForm(p => ({ ...p, image_url: e.target.value }))} placeholder="https://..." />

                            {form.price > 0 && previewCost > 0 && (
                                <div className="bg-[#12121f] border rounded-xl p-4 mb-4 mt-2" style={{ borderColor: `${fcColor(previewFc)}40` }}>
                                    <div className="grid grid-cols-3 gap-2 text-center">
                                        <div><div className="text-xs text-[#6b7280] mb-1">ต้นทุน</div><div className="font-['JetBrains_Mono'] font-bold text-[#e2e8f0]">฿{previewCost.toFixed(1)}</div></div>
                                        <div><div className="text-xs text-[#6b7280] mb-1">กำไร/จาน</div><div className="font-['JetBrains_Mono'] font-bold text-[#22c55e]">฿{(parseFloat(form.price) - previewCost).toFixed(1)}</div></div>
                                        <div><div className="text-xs text-[#6b7280] mb-1">Food Cost</div><div className="font-['JetBrains_Mono'] font-bold text-lg" style={{ color: fcColor(previewFc) }}>{previewFc.toFixed(1)}%</div></div>
                                    </div>
                                </div>
                            )}

                            <div className="flex gap-2 justify-end mt-4">
                                <Btn variant="ghost" onClick={() => setShowModal(false)} className="flex-1 md:flex-none">ยกเลิก</Btn>
                                <Btn onClick={save} className="flex-1 md:flex-none">บันทึกขึ้นป้าย</Btn>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        }

        // ─── MAIN APP ────────────────────────────────────────────────────────────────
        function App() {
            const [tab, setTab] = useState("dashboard");
            const [ingredients, setIngredients] = useState([]);
            const [recipes, setRecipes] = useState([]);
            const [menu, setMenu] = useState([]);
            const [loadingDb, setLoadingDb] = useState(true);

            useEffect(() => {
                async function loadData() {
                    try {
                        const [ingRes, recRes, riRes, menuRes] = await Promise.all([
                            supabaseClient.from('ingredients').select('*').order('id'),
                            supabaseClient.from('recipes').select('*').order('id'),
                            supabaseClient.from('recipe_items').select('*'),
                            supabaseClient.from('menus').select('*').order('id')
                        ]);

                        setIngredients(ingRes.data || []);
                        const formattedRecipes = (recRes.data || []).map(r => ({
                            ...r, items: (riRes.data || []).filter(ri => ri.recipeId === r.id)
                        }));
                        setRecipes(formattedRecipes);
                        setMenu(menuRes.data || []);
                    } catch (err) {
                        console.error("Error load DB:", err);
                    } finally {
                        setLoadingDb(false);
                    }
                }
                loadData();
            }, []);

            const navItems = [
                { id: "dashboard", label: "Dashboard", icon: "📊" },
                { id: "ingredients", label: "วัตถุดิบ", icon: "🥩" },
                { id: "recipes", label: "สูตรอาหาร", icon: "🍳" },
                { id: "menu", label: "เมนูหน้าร้าน", icon: "📋" },
            ];

            if (loadingDb) {
                return <div className="h-screen bg-[#0d0d1a] flex flex-col items-center justify-center text-[#f59e0b] font-['Sora']">
                    <div className="text-4xl mb-4 animate-bounce">🍜</div>
                    <div className="animate-pulse">กำลังตั้งเตา เชื่อมต่อฐานข้อมูล...</div>
                </div>;
            }

            return (
                <>
                    <style>{FONTS}</style>
                    <style>{`
                        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
                        body { margin: 0; background: #0d0d1a; }
                        .scrollbar-hide::-webkit-scrollbar { display: none; }
                        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
                        ::-webkit-scrollbar { width: 4px; height: 4px; }
                        ::-webkit-scrollbar-track { background: transparent; }
                        ::-webkit-scrollbar-thumb { background: #2a2a45; border-radius: 4px; }
                        .pb-safe { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)); }
                    `}</style>

                    <div className="flex flex-col md:flex-row h-[100dvh] bg-[#0d0d1a] font-['Sora'] text-[#f1f5f9] overflow-hidden">
                        <div className="hidden md:flex flex-col flex-shrink-0 w-[240px] bg-[#12121f] border-r border-[#1e1e35]">
                            <div className="p-6 border-b border-[#1e1e35]">
                                <div className="flex items-center gap-3">
                                    <div className="bg-gradient-to-br from-[#f59e0b] to-[#f97316] w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-orange-500/20">🍜</div>
                                    <div>
                                        <div className="font-bold text-lg text-[#f1f5f9] leading-tight">FoodCost</div>
                                        <div className="text-[0.65rem] text-[#22c55e] font-['JetBrains_Mono']">🟢 Cloud Sync On</div>
                                    </div>
                                </div>
                            </div>
                            <nav className="p-4 flex-1 flex flex-col gap-2">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => setTab(item.id)} 
                                        className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${tab === item.id ? 'bg-[#f59e0b]/15 text-[#f59e0b] font-semibold' : 'text-[#6b7280] hover:bg-[#1a1a2e] hover:text-[#e2e8f0]'}`}>
                                        <span className="text-lg">{item.icon}</span>
                                        <span className="text-sm">{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        <div className="flex-1 overflow-auto p-4 md:p-8 pb-24 md:pb-8 relative scroll-smooth" style={{ WebkitOverflowScrolling: "touch" }}>
                            {tab === "dashboard" && <Dashboard ingredients={ingredients} recipes={recipes} menu={menu} />}
                            {tab === "ingredients" && <IngredientsPage ingredients={ingredients} setIngredients={setIngredients} />}
                            {tab === "recipes" && <RecipesPage ingredients={ingredients} recipes={recipes} setRecipes={setRecipes} />}
                            {tab === "menu" && <MenuPage ingredients={ingredients} recipes={recipes} menu={menu} setMenu={setMenu} />}
                        </div>

                        <div className="md:hidden fixed bottom-0 left-0 right-0 bg-[#12121f]/95 backdrop-blur-md border-t border-[#1e1e35] flex justify-around items-end pb-safe pt-2 px-2 z-50">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setTab(item.id)} 
                                    className={`flex flex-col items-center justify-center w-full py-1 gap-1 transition-all ${tab === item.id ? 'text-[#f59e0b] scale-110' : 'text-[#6b7280] active:scale-95'}`}>
                                    <span className="text-xl mb-0.5" style={{ filter: tab === item.id ? 'drop-shadow(0 2px 4px rgba(245,158,11,0.3))' : 'grayscale(100%) opacity(50%)' }}>{item.icon}</span>
                                    <span className="text-[0.65rem] font-medium">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
