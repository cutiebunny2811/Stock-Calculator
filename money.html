// ─── Helpers ─────────────────────────────────────────────────────────────────
const fmt = n => Math.abs(n).toLocaleString("th-TH");

function Bar({ value, max, color = "#a78bfa" }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  return (
    <div style={{ width: "100%", height: 4, background: "#2a2a3a", borderRadius: 999, overflow: "hidden" }}>
      <div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 999, transition: "width .5s cubic-bezier(.4,0,.2,1)" }} />
    </div>
  );
}

function PieChart({ slices, size = 140 }) {
  let cum = 0;
  const total = slices.reduce((s, x) => s + x.value, 0);
  if (!total) return null;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ filter: "drop-shadow(0 4px 12px rgba(0,0,0,.5))" }}>
      {slices.map(sl => {
        const pct = sl.value / total;
        const a0 = cum * 2 * Math.PI - Math.PI / 2;
        cum += pct;
        const a1 = cum * 2 * Math.PI - Math.PI / 2;
        const r = size / 2 - 8, cx = size / 2, cy = size / 2;
        if (pct >= 1) return <circle key={sl.label} cx={cx} cy={cy} r={r} fill="none" stroke={sl.color} strokeWidth={10} />;
        const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
        const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
        return <path key={sl.label} d={`M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${pct > .5 ? 1 : 0},1 ${x1},${y1} Z`} fill={sl.color} opacity={0.9} />;
      })}
      <circle cx={size/2} cy={size/2} r={size/2 - 22} fill="#1a1a2e" />
    </svg>
  );
}

function IBtn({ onClick, iconKey, bg = "transparent", color = "#6b7280", size = 32 }) {
  return (
    <button onClick={onClick} style={{ width: size, height: size, borderRadius: 8, border: "none", background: bg, color, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
      <CategoryIcon iconKey={iconKey} size={14} color={color} />
    </button>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(() => {
    const saved = localStorage.getItem("my_budget_data");
    return saved ? JSON.parse(saved) : DEFAULT_DATA;
  });

  useEffect(() => {
    localStorage.setItem("my_budget_data", JSON.stringify(data));
  }, [data]);

  const [editingIncome, setEditingIncome]   = useState(false);
  const [tempIncome, setTempIncome]         = useState("");
  const [addingRound, setAddingRound]       = useState(false);
  const [newRoundLabel, setNewRoundLabel]   = useState("");
  const [newRoundIncome, setNewRoundIncome] = useState("");
  const [addingItem, setAddingItem]         = useState(null);
  const [newItem, setNewItem]               = useState({ icon: "food", label: "", amount: "" });
  const [addingAlloc, setAddingAlloc]       = useState(false);
  const [newAlloc, setNewAlloc]             = useState({ icon: "banknote", label: "", amount: "", color: "#a78bfa" });
  const [activeTab, setActiveTab]           = useState("expenses");
  const [editingRound, setEditingRound]     = useState(null);
  const [editRLabel, setEditRLabel]         = useState("");
  const [editRIncome, setEditRIncome]       = useState("");

  const totalExpenses  = useMemo(() => data.rounds.reduce((s, r) => s + r.items.reduce((a, i) => a + (i.amount > 0 ? i.amount : 0), 0), 0), [data]);
  const totalAllocated = useMemo(() => data.allocations.reduce((s, a) => s + a.amount, 0), [data]);
  const remaining = data.totalIncome - totalExpenses;
  const funMoney  = remaining - totalAllocated;

  const roundRems = useMemo(() => {
    let carry = 0;
    return data.rounds.map(r => {
      const spent = r.items.reduce((s, i) => s + (i.amount > 0 ? i.amount : 0), 0);
      const rem = r.income + carry - spent;
      carry = rem > 0 ? rem : 0;
      return rem;
    });
  }, [data]);

  const pieSlices = useMemo(() => {
    const pal = ["#f472b6","#fb923c","#facc15","#4ade80","#22d3ee","#818cf8","#e879f9","#f87171","#38bdf8","#a3e635"];
    const exp = data.rounds.flatMap((r, ri) => r.items.filter(i => i.amount > 0).map((it, ii) => ({ label: it.label, value: it.amount, color: pal[(ri*9+ii) % pal.length] })));
    return [...exp, ...data.allocations.map(a => ({ label: a.label, value: a.amount, color: a.color })), ...(funMoney > 0 ? [{ label: data.funMoneyLabel, value: funMoney, color: "#ec4899" }] : [])];
  }, [data, funMoney]);

  function saveIncome() { const n = parseFloat(tempIncome); if (!isNaN(n)) setData(d => ({ ...d, totalIncome: n })); setEditingIncome(false); }
  function delItem(rid, iid) { setData(d => ({ ...d, rounds: d.rounds.map(r => r.id === rid ? { ...r, items: r.items.filter(i => i.id !== iid) } : r) })); }
  function delRound(rid)     { setData(d => ({ ...d, rounds: d.rounds.filter(r => r.id !== rid) })); }
  function delAlloc(aid)     { setData(d => ({ ...d, allocations: d.allocations.filter(a => a.id !== aid) })); }
  function doAddRound()  { const n = parseFloat(newRoundIncome); if (!newRoundLabel.trim() || isNaN(n)) return; setData(d => ({ ...d, rounds: [...d.rounds, { id: Date.now(), label: newRoundLabel.trim(), income: n, items: [] }] })); setNewRoundLabel(""); setNewRoundIncome(""); setAddingRound(false); }
  function doAddItem()   { const n = parseFloat(newItem.amount); if (!newItem.label.trim() || isNaN(n)) return; setData(d => ({ ...d, rounds: d.rounds.map(r => r.id === addingItem ? { ...r, items: [...r.items, { id: Date.now(), icon: newItem.icon, label: newItem.label.trim(), amount: n }] } : r) })); setNewItem({ icon: "food", label: "", amount: "" }); setAddingItem(null); }
  function doAddAlloc()  { const n = parseFloat(newAlloc.amount); if (!newAlloc.label.trim() || isNaN(n)) return; setData(d => ({ ...d, allocations: [...d.allocations, { id: Date.now(), icon: newAlloc.icon, label: newAlloc.label.trim(), amount: n, color: newAlloc.color }] })); setNewAlloc({ icon: "banknote", label: "", amount: "", color: "#a78bfa" }); setAddingAlloc(false); }
  function doEditRound(rid) { const n = parseFloat(editRIncome); if (!editRLabel.trim() || isNaN(n)) return; setData(d => ({ ...d, rounds: d.rounds.map(r => r.id === rid ? { ...r, label: editRLabel.trim(), income: n } : r) })); setEditingRound(null); }

  const inp = { background: "#1e1e30", border: "1px solid #3a3a5c", borderRadius: 10, color: "#e2e8f0", padding: "10px 14px", fontSize: 14, outline: "none", width: "100%", boxSizing: "border-box", fontFamily: "inherit" };
  const btn = (bg = "#7c3aed", col = "#fff") => ({ background: bg, border: "none", borderRadius: 10, color: col, padding: "10px 18px", fontSize: 13, cursor: "pointer", fontWeight: 600, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 });
  const card = { background: "#141422", borderRadius: 16, padding: "18px 16px", marginBottom: 12, border: "1px solid #1e1e35" };

  const IconPicker = ({ icons, selected, onSelect }) => (
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
      {icons.map(k => (
        <button key={k} onClick={() => onSelect(k)} style={{ width: 34, height: 34, borderRadius: 8, border: "none", cursor: "pointer", background: selected === k ? "#7c3aed" : "#1e1e35", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <CategoryIcon iconKey={k} size={14} color={selected === k ? "#fff" : "#6b7280"} />

      ))}
    </div>
  );

  return (

        {/* Header */}

          <div style={{ position: "absolute", top: -40, right: -40, width: 160, height: 160, background: "radial-gradient(circle,rgba(167,139,250,.15) 0%,transparent 70%)", borderRadius: "50%", pointerEvents: "none" }} />
          <div style={{ fontSize: 11, color: "#a78bfa", fontWeight: 700, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 14 }}>สรุปงบประมาณ</div>

          {editingIncome ? (
            <div style={{ display: "flex", gap: 8, alignItems: "stretch", marginBottom: 16 }}>
              <input type="number" value={tempIncome} onChange={e => setTempIncome(e.target.value)} autoFocus
                onKeyDown={e => { if (e.key === "Enter") saveIncome(); if (e.key === "Escape") setEditingIncome(false); }}

              <button onClick={saveIncome}             style={{ ...btn("#4ade80","#052e16"), padding: "0 16px", minWidth: 50, minHeight: 52, borderRadius: 10 }}><CategoryIcon iconKey="check" size={20} color="#052e16" /></button>
              <button onClick={() => setEditingIncome(false)} style={{ ...btn("#374151"), padding: "0 16px", minWidth: 50, minHeight: 52, borderRadius: 10 }}><CategoryIcon iconKey="close" size={20} /></button>
            </div>
          ) : (
            <button onClick={() => { setTempIncome(String(data.totalIncome)); setEditingIncome(true); }}
              style={{ background: "rgba(255,255,255,.08)", border: "1px solid rgba(167,139,250,.3)", borderRadius: 14, padding: "16px 20px", width: "100%", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <div style={{ textAlign: "left" }}>
                <div style={{ fontSize: 11, color: "#a78bfa", marginBottom: 5 }}>รายรับรวมทั้งเดือน</div>
                <div style={{ fontSize: 32, fontWeight: 700, color: "#fff", lineHeight: 1, letterSpacing: -0.5 }}>{fmt(data.totalIncome)}<span style={{ fontSize: 16, color: "#d8b4fe", marginLeft: 6 }}>฿</span></div>
              </div>
              <CategoryIcon iconKey="edit" size={18} color="#a78bfa" />
            </button>
          )}

          <div style={{ background: "rgba(255,255,255,.08)", borderRadius: 12, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 11, color: "#c4b5fd" }}>หลังหักค่าใช้จ่ายเหลือ</div>
              <div style={{ fontSize: 22, fontWeight: 700, color: remaining >= 0 ? "#4ade80" : "#f87171", marginTop: 2 }}>{remaining >= 0 ? "" : "−"}{fmt(remaining)} ฿</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontSize: 11, color: "#c4b5fd" }}>ใช้ไปแล้ว</div>
              <div style={{ fontSize: 18, fontWeight: 600, color: "#fb923c" }}>{fmt(totalExpenses)} ฿</div>
              <div style={{ fontSize: 11, color: "#a78bfa", marginTop: 2 }}>{data.totalIncome > 0 ? ((totalExpenses / data.totalIncome) * 100).toFixed(1) : 0}% ของรายรับ</div>
            </div>
          </div>
          <div style={{ marginTop: 10 }}><Bar value={totalExpenses} max={data.totalIncome} color="linear-gradient(90deg,#f472b6,#fb923c)" /></div>
        </div>

        {/* Tabs */}
        <div style={{ display: "flex", background: "#1a1a2e", borderRadius: 12, padding: 4, marginBottom: 16, gap: 4 }}>
          {[["expenses","list","รายจ่าย"],["chart","piechart","สัดส่วน"]].map(([tab, icon, label]) => (
            <button key={tab} onClick={() => setActiveTab(tab)} style={{ flex: 1, padding: "10px 0", borderRadius: 9, border: "none", cursor: "pointer", fontWeight: 600, fontSize: 13, background: activeTab === tab ? "#7c3aed" : "transparent", color: activeTab === tab ? "#fff" : "#6b7280", transition: "all .2s", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
              <CategoryIcon iconKey={icon} size={14} color={activeTab === tab ? "#fff" : "#6b7280"} />{label}
            </button>
          ))}
        </div>

        {activeTab === "expenses" ? (
          <>
            {data.rounds.map((round, ri) => {
              const spent = round.items.reduce((s, i) => s + (i.amount > 0 ? i.amount : 0), 0);
              const pct = round.income > 0 ? ((spent / round.income) * 100).toFixed(1) : 0;
              return (
                <div key={round.id} style={card}>
                  {editingRound === round.id ? (
                    <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
                      <input value={editRLabel} onChange={e => setEditRLabel(e.target.value)} style={{ ...inp, flex: 1, minWidth: 100 }} placeholder="ชื่อรอบ" />
                      <input value={editRIncome} onChange={e => setEditRIncome(e.target.value)} type="number" style={{ ...inp, width: 110 }} placeholder="รายรับ" />
                      <button onClick={() => doEditRound(round.id)} style={{ ...btn(), padding: "0 14px", minHeight: 42, borderRadius: 10 }}><CategoryIcon iconKey="check" size={16} /></button>
                      <button onClick={() => setEditingRound(null)} style={{ ...btn("#374151"), padding: "0 14px", minHeight: 42, borderRadius: 10 }}><CategoryIcon iconKey="close" size={16} /></button>
                    </div>
                  ) : (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{ width: 28, height: 28, borderRadius: "50%", background: "linear-gradient(135deg,#7c3aed,#a855f7)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#fff" }}>{ri + 1}</div>
                        <div>
                          <div style={{ fontWeight: 600, fontSize: 14 }}>{round.label}</div>
                          <div style={{ fontSize: 11, color: "#22c55e", marginTop: 1 }}>+{fmt(round.income)} ฿</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: "#6b7280", marginRight: 4 }}>{pct}% ใช้ไป</span>
                        <IBtn onClick={() => { setEditingRound(round.id); setEditRLabel(round.label); setEditRIncome(String(round.income)); }} iconKey="edit" bg="#1e1e35" color="#a78bfa" />
                        {data.rounds.length > 1 && <IBtn onClick={() => delRound(round.id)} iconKey="trash" bg="#2a1010" color="#f87171" />}
                      </div>
                    </div>
                  )}

                  <div style={{ marginBottom: 12 }}><Bar value={spent} max={round.income} color="#a78bfa" /></div>

                  {round.items.map(item => {
                    const ipct = data.totalIncome > 0 ? ((Math.abs(item.amount) / data.totalIncome) * 100).toFixed(1) : 0;
                    const isSpec = item.amount <= 0;
                    return (
                      <div key={item.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 0", borderBottom: "1px solid #1e1e35" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
                          <div style={{ width: 30, height: 30, borderRadius: 8, background: "#1e1e35", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                            <CategoryIcon iconKey={item.icon} size={14} color="#a78bfa" />
                          </div>
                          <div style={{ minWidth: 0 }}>
                            <div style={{ fontSize: 13, fontWeight: 500, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.label}</div>
                            {!isSpec && <div style={{ fontSize: 10, color: "#6b7280", marginTop: 1 }}>{ipct}% ของรายรับ</div>}
                          </div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ fontSize: 13, fontWeight: 600, color: isSpec ? "#6b7280" : "#f87171", minWidth: 72, textAlign: "right" }}>{isSpec ? "" : "−"}{fmt(item.amount)} ฿</span>
                          <IBtn onClick={() => delItem(round.id, item.id)} iconKey="close" color="#4b5563" size={28} />
                        </div>
                      </div>
                    );
                  })}

                  {addingItem === round.id ? (
                    <div style={{ marginTop: 12, background: "#1a1a2e", borderRadius: 12, padding: 14 }}>
                      <div style={{ fontSize: 12, color: "#a78bfa", marginBottom: 10, fontWeight: 600 }}>เพิ่มรายการ</div>
                      <IconPicker icons={CATEGORY_ICONS} selected={newItem.icon} onSelect={k => setNewItem(x => ({ ...x, icon: k }))} />
                      <input value={newItem.label} onChange={e => setNewItem(x => ({ ...x, label: e.target.value }))} style={{ ...inp, marginBottom: 8 }} placeholder="ชื่อรายการ" />
                      <input value={newItem.amount} onChange={e => setNewItem(x => ({ ...x, amount: e.target.value }))} type="number" style={{ ...inp, marginBottom: 10 }} placeholder="จำนวนเงิน (บาท)" />
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={doAddItem} style={{ ...btn(), flex: 1 }}><CategoryIcon iconKey="plus" size={14} />เพิ่ม</button>
                        <button onClick={() => setAddingItem(null)} style={{ ...btn("#374151"), flex: 1 }}>ยกเลิก</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => setAddingItem(round.id)} style={{ marginTop: 12, background: "transparent", border: "1px dashed #3a3a5c", borderRadius: 10, color: "#6b7280", padding: "10px 0", width: "100%", cursor: "pointer", fontSize: 13, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                      <CategoryIcon iconKey="plus" size={14} color="#6b7280" />เพิ่มรายการ
                    </button>
                  )}

                  <div style={{ marginTop: 12, background: "#1a1a2e", borderRadius: 10, padding: "10px 14px", display: "flex", justifyContent: "space-between" }}>
                    <span style={{ fontSize: 12, color: "#6b7280" }}>{ri < data.rounds.length - 1 ? "คงเหลือยกยอดรอบถัดไป" : "คงเหลือรอบนี้"}</span>
                    <span style={{ fontSize: 13, fontWeight: 700, color: roundRems[ri] >= 0 ? "#4ade80" : "#f87171" }}>{fmt(roundRems[ri])} ฿</span>
                  </div>
                </div>
              );
            })}

            {addingRound ? (
              <div style={card}>
                <div style={{ fontSize: 12, color: "#a78bfa", marginBottom: 10, fontWeight: 600 }}>เพิ่มรอบรายรับ</div>
                <input value={newRoundLabel} onChange={e => setNewRoundLabel(e.target.value)} style={{ ...inp, marginBottom: 8 }} placeholder="ชื่อรอบ เช่น รอบสาม" />
                <input value={newRoundIncome} onChange={e => setNewRoundIncome(e.target.value)} type="number" style={{ ...inp, marginBottom: 10 }} placeholder="รายรับ (บาท)" />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={doAddRound} style={{ ...btn(), flex: 1 }}><CategoryIcon iconKey="plus" size={14} />เพิ่มรอบ</button>
                  <button onClick={() => setAddingRound(false)} style={{ ...btn("#374151"), flex: 1 }}>ยกเลิก</button>
                </div>
              </div>
            ) : (
              <button onClick={() => setAddingRound(true)} style={{ background: "transparent", border: "1px dashed #3a3a5c", borderRadius: 12, color: "#7c3aed", padding: "12px 0", width: "100%", cursor: "pointer", fontSize: 13, fontWeight: 600, marginBottom: 16, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                <CategoryIcon iconKey="plus" size={14} color="#7c3aed" />เพิ่มรอบรายรับ
              </button>
            )}

            {/* Allocations */}
            <div style={card}>
              <div style={{ fontSize: 11, color: "#6b7280", fontWeight: 700, letterSpacing: 0.5, marginBottom: 14, textTransform: "uppercase" }}>จัดสรรเงินคงเหลือ ({fmt(remaining)} ฿)</div>

              {data.allocations.map(al => {
                const pct = remaining > 0 ? ((al.amount / remaining) * 100).toFixed(1) : 0;
                return (
                  <div key={al.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#1a1a2e", borderRadius: 10, padding: "12px 14px", marginBottom: 8 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ width: 34, height: 34, borderRadius: 10, background: `${al.color}22`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <CategoryIcon iconKey={al.icon} size={16} color={al.color} />
                      </div>
                      <div>
                        <div style={{ fontSize: 13, fontWeight: 600 }}>{al.label}</div>
                        <div style={{ fontSize: 10, color: "#6b7280" }}>{pct}% ของที่เหลือ</div>
                      </div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontSize: 15, fontWeight: 700, color: al.color }}>{fmt(al.amount)}</span>
                      <IBtn onClick={() => delAlloc(al.id)} iconKey="close" color="#4b5563" size={28} />
                    </div>
                  </div>
                );
              })}

              {addingAlloc ? (
                <div style={{ background: "#1a1a2e", borderRadius: 12, padding: 14, marginBottom: 10 }}>
                  <IconPicker icons={ALLOC_ICONS} selected={newAlloc.icon} onSelect={k => setNewAlloc(x => ({ ...x, icon: k }))} />
                  <input value={newAlloc.label} onChange={e => setNewAlloc(x => ({ ...x, label: e.target.value }))} style={{ ...inp, marginBottom: 8 }} placeholder="ชื่อ เช่น ออม / ลงทุน" />
                  <input value={newAlloc.amount} onChange={e => setNewAlloc(x => ({ ...x, amount: e.target.value }))} type="number" style={{ ...inp, marginBottom: 8 }} placeholder="จำนวนเงิน (บาท)" />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={doAddAlloc} style={{ ...btn(), flex: 1 }}><CategoryIcon iconKey="plus" size={14} />เพิ่ม</button>
                    <button onClick={() => setAddingAlloc(false)} style={{ ...btn("#374151"), flex: 1 }}>ยกเลิก</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setAddingAlloc(true)} style={{ background: "transparent", border: "1px dashed #3a3a5c", borderRadius: 10, color: "#6b7280", padding: "10px 0", width: "100%", cursor: "pointer", fontSize: 13, marginBottom: 10, fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                  <CategoryIcon iconKey="plus" size={14} color="#6b7280" />เพิ่มหมวดจัดสรร
                </button>
              )}

              {/* Fun Money */}
              <div style={{ background: "linear-gradient(135deg,#831843,#be185d)", borderRadius: 12, padding: "14px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", boxShadow: "0 4px 16px rgba(190,24,93,.3)" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 34, height: 34, borderRadius: 10, background: "rgba(255,255,255,.15)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <CategoryIcon iconKey="party" size={16} color="#fff" />
                  </div>
                  <div>
                    <input value={data.funMoneyLabel} onChange={e => setData(d => ({ ...d, funMoneyLabel: e.target.value }))}
                      style={{ background: "transparent", border: "none", color: "#fbcfe8", fontSize: 12, fontWeight: 600, outline: "none", width: 110, fontFamily: "inherit" }} />
                    <div style={{ fontSize: 10, color: "#f9a8d4" }}>{remaining > 0 ? ((funMoney / remaining) * 100).toFixed(1) : 0}% ของที่เหลือ</div>
                  </div>
                </div>
                <div style={{ fontSize: 20, fontWeight: 700, color: "#fff" }}>{funMoney >= 0 ? "" : "−"}{fmt(funMoney)} ฿</div>
              </div>
            </div>
          </>
        ) : (
          <div style={card}>
            <div style={{ fontSize: 11, color: "#6b7280", fontWeight: 700, letterSpacing: 0.5, marginBottom: 18, textTransform: "uppercase" }}>สัดส่วนการใช้จ่าย</div>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 24 }}><PieChart slices={pieSlices} size={140} /></div>
            {pieSlices.map(s => {
              const tot = pieSlices.reduce((a, x) => a + x.value, 0);
              const pct = tot > 0 ? ((s.value / tot) * 100).toFixed(1) : 0;
              return (
                <div key={s.label} style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                      <div style={{ width: 10, height: 10, borderRadius: "50%", background: s.color, flexShrink: 0 }} />
                      <span style={{ fontSize: 12, color: "#cbd5e1" }}>{s.label}</span>
                    </div>
                    <div style={{ fontSize: 12, fontWeight: 600 }}>{fmt(s.value)} ฿ <span style={{ color: "#6b7280", fontWeight: 400 }}>({pct}%)</span></div>
                  </div>
                  <Bar value={s.value} max={tot} color={s.color} />
                </div>
              );
            })}
          </div>
        )}

        {/* Footer */}
        <div style={{ background: "#141422", borderRadius: 16, padding: 16, marginTop: 4, border: "1px solid #1e1e35", display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, textAlign: "center" }}>
          {[["รายรับรวม", data.totalIncome, "#4ade80"],["รายจ่ายรวม", totalExpenses, "#f87171"],["คงเหลือสุทธิ", funMoney, "#a78bfa"]].map(([label, value, color]) => (
            <div key={label}>
              <div style={{ fontSize: 9, color: "#6b7280", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 4 }}>{label}</div>
              <div style={{ fontSize: 14, fontWeight: 700, color }}>{fmt(value)}</div>
              <div style={{ fontSize: 9, color: "#4b5563" }}>฿</div>
            </div>
          ))}
        </div>

        <div style={{ height: 32 }} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
