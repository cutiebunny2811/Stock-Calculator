<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Rebalance Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input, button { outline: none; }
        body { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 antialiased min-h-screen font-sans selection:bg-indigo-500/30">

    <div class="max-w-7xl mx-auto p-4 md:p-8 fade-in">
        
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <div class="bg-gradient-to-tr from-indigo-500 to-purple-600 p-3 rounded-2xl shadow-lg shadow-indigo-900/20">
                    <i data-lucide="layout-dashboard" class="text-white w-8 h-8"></i>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">Smart Rebalance</h1>
                    <p class="text-sm text-zinc-500">Desktop Dashboard</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="refreshPrices()" id="btn-refresh" class="flex items-center gap-2 px-4 py-2 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 rounded-xl transition-all text-zinc-300 font-bold text-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4 text-indigo-500"></i> Sync Prices
                </button>
                <button onclick="toggleSettings()" class="p-3 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-400 transition-colors">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="lg:sticky lg:top-8 space-y-6">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-zinc-900/80 backdrop-blur rounded-2xl border border-zinc-800 p-5">
                            <p class="text-xs text-zinc-500 uppercase font-bold tracking-wider mb-2">Portfolio Value</p>
                            <h2 id="total-value" class="text-2xl md:text-3xl font-black text-white tracking-tight">$0.00</h2>
                            <p class="text-[10px] text-zinc-600 mt-2 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live Data</p>
                        </div>
                        <div class="bg-zinc-900/80 backdrop-blur rounded-2xl border border-zinc-800 p-5">
                            <p class="text-xs text-zinc-500 uppercase font-bold tracking-wider mb-2">Target Allocation</p>
                            <h2 id="total-target-pct" class="text-2xl md:text-3xl font-black text-zinc-500">0%</h2>
                            <p class="text-[10px] text-zinc-600 mt-2">Goal: 100%</p>
                        </div>
                    </div>

                    <div class="bg-zinc-900/80 backdrop-blur rounded-3xl border border-zinc-800 p-6 relative aspect-square flex flex-col justify-center shadow-xl shadow-black/20">
                        <canvas id="chartAlloc"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span class="text-xs text-zinc-500 font-bold uppercase tracking-widest">Assets</span>
                            <span id="chart-center-count" class="text-4xl font-black text-white mt-1">0</span>
                        </div>
                    </div>

                    <div class="bg-zinc-900 rounded-2xl border border-zinc-800 p-5 space-y-4">
                        <div class="flex items-center gap-2 pb-2 border-b border-zinc-800"><i data-lucide="plus-circle" class="w-5 h-5 text-indigo-500"></i><span class="font-bold text-white">Manage Asset</span></div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="inp-ticker" placeholder="TICKER" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500 uppercase font-bold">
                            <input type="number" id="inp-target" placeholder="Target %" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500 text-indigo-400 font-bold">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="inp-qty" placeholder="Qty" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500">
                            <input type="number" id="inp-price" placeholder="Cost ($)" class="bg-black border border-zinc-800 rounded-xl px-4 py-3 text-white text-sm focus:border-indigo-500">
                        </div>
                        <button onclick="addHolding()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-indigo-900/20 transform active:scale-95">Save / Update Asset</button>
                    </div>

                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="flex items-center justify-between mb-4 px-1">
                    <h3 class="text-lg font-bold text-zinc-400">Holdings & Rebalance Actions</h3>
                    <span class="text-xs text-zinc-600" id="last-updated">Synced: --:--</span>
                </div>
                
                <div id="holdings-list" class="grid grid-cols-1 gap-4">
                    </div>
            </div>

        </div>

        <div id="modal-settings" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50 fade-in">
            <div class="bg-zinc-900 w-full max-w-md rounded-3xl border border-zinc-800 p-8 space-y-6 shadow-2xl">
                <h3 class="text-xl font-bold text-white flex items-center gap-2"><i data-lucide="database" class="w-5 h-5 text-indigo-500"></i> Data Settings</h3>
                
                <div>
                    <label class="text-xs text-zinc-500 uppercase font-bold block mb-2">Google Sheet CSV Link</label>
                    <textarea id="inp-csv-link" rows="3" placeholder="https://docs.google.com/spreadsheets/.../pub?output=csv" class="w-full bg-black border border-zinc-800 rounded-xl p-4 text-xs text-zinc-300 focus:border-indigo-500 resize-none font-mono"></textarea>
                </div>

                <div class="bg-zinc-800/50 rounded-xl p-4 border border-zinc-800">
                    <p class="text-xs text-zinc-500 font-bold mb-3 uppercase">Backup & Restore</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="exportData()" class="flex items-center justify-center gap-2 py-2.5 rounded-lg bg-black border border-zinc-700 hover:border-zinc-500 text-zinc-300 text-xs font-bold transition-all"><i data-lucide="copy" class="w-3 h-3"></i> Copy Data</button>
                        <button onclick="importData()" class="flex items-center justify-center gap-2 py-2.5 rounded-lg bg-black border border-zinc-700 hover:border-zinc-500 text-zinc-300 text-xs font-bold transition-all"><i data-lucide="download" class="w-3 h-3"></i> Import Data</button>
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button onclick="toggleSettings()" class="flex-1 py-3 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm font-bold transition-colors">Close</button>
                    <button onclick="saveSettings()" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold shadow-lg shadow-indigo-900/20 transition-colors">Save Changes</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
        
        let holdings = JSON.parse(localStorage.getItem('smart_port_holdings')) || [];
        let config = JSON.parse(localStorage.getItem('smart_port_config')) || { csvUrl: '' };
        let chartInstance = null;
        const moneyFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

        // INIT
        renderHoldings();
        updateCharts();

        // --- CORE LOGIC ---
        function addHolding() {
            const ticker = document.getElementById('inp-ticker').value.toUpperCase().trim();
            const qty = parseFloat(document.getElementById('inp-qty').value);
            const cost = parseFloat(document.getElementById('inp-price').value);
            const target = parseFloat(document.getElementById('inp-target').value) || 0;

            if (!ticker || isNaN(qty) || isNaN(cost)) return alert("Please fill details");

            const existing = holdings.find(h => h.ticker === ticker);
            if (existing) {
                const totalCost = (existing.qty * existing.avgCost) + (qty * cost);
                const totalQty = existing.qty + qty;
                existing.qty = totalQty;
                existing.avgCost = totalCost / totalQty;
                existing.target = target > 0 ? target : existing.target; 
            } else {
                holdings.push({ ticker, qty, avgCost: cost, marketPrice: cost, target: target });
            }
            saveData(); renderHoldings(); updateCharts();
            // Clear inputs
            document.getElementById('inp-ticker').value = ''; document.getElementById('inp-qty').value = ''; 
            document.getElementById('inp-price').value = ''; document.getElementById('inp-target').value = '';
        }

        function removeHolding(ticker) {
            if(confirm('Delete ' + ticker + '?')) { holdings = holdings.filter(h => h.ticker !== ticker); saveData(); renderHoldings(); updateCharts(); }
        }

        function renderHoldings() {
            let totalVal = 0;
            let totalTarget = 0;
            holdings.forEach(h => {
                totalVal += h.qty * (h.marketPrice || h.avgCost);
                totalTarget += (h.target || 0);
            });

            const list = document.getElementById('holdings-list'); list.innerHTML = '';
            
            holdings.forEach(h => {
                const marketVal = h.qty * (h.marketPrice || h.avgCost);
                const currentPct = totalVal > 0 ? (marketVal / totalVal) * 100 : 0;
                const targetPct = h.target || 0;
                
                // Rebalance Logic
                const idealVal = totalVal * (targetPct / 100);
                const diffVal = idealVal - marketVal; 
                const diffUnits = diffVal / (h.marketPrice || h.avgCost);

                let actionHtml = '';
                if (Math.abs(diffVal) > 10) { 
                    if (diffVal > 0) {
                        // BUY
                        actionHtml = `
                        <div class="mt-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-3 flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Buy</span>
                                <span class="text-xs font-bold text-emerald-300">Increase Position</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-sm font-black text-emerald-400">+${moneyFmt.format(diffVal)}</span>
                                <span class="block text-[10px] text-emerald-500/70">approx. +${diffUnits.toFixed(2)} units</span>
                            </div>
                        </div>`;
                    } else {
                        // SELL
                        actionHtml = `
                        <div class="mt-3 bg-rose-500/10 border border-rose-500/30 rounded-lg p-3 flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase">Sell</span>
                                <span class="text-xs font-bold text-rose-300">Trim Position</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-sm font-black text-rose-400">${moneyFmt.format(diffVal)}</span>
                                <span class="block text-[10px] text-rose-500/70">approx. ${diffUnits.toFixed(2)} units</span>
                            </div>
                        </div>`;
                    }
                } else {
                    actionHtml = `
                    <div class="mt-3 bg-zinc-800/40 border border-zinc-700/30 rounded-lg p-2 flex justify-center items-center gap-2">
                        <i data-lucide="check-circle-2" class="w-3 h-3 text-zinc-500"></i>
                        <span class="text-[10px] font-bold text-zinc-500 uppercase tracking-wide">Balanced</span>
                    </div>`;
                }

                // Progress Bar Logic
                let barColor = 'bg-zinc-600';
                if (currentPct > targetPct + 2) barColor = 'bg-rose-500';
                else if (currentPct < targetPct - 2) barColor = 'bg-emerald-500';
                else barColor = 'bg-indigo-500';

                list.insertAdjacentHTML('beforeend', `
                <div class="bg-zinc-900/50 border border-zinc-800 hover:border-zinc-700 transition-colors rounded-2xl p-5 shadow-sm">
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                        
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-1">
                                <span class="font-black text-white text-xl tracking-tight">${h.ticker}</span>
                                <span class="text-xs font-bold bg-zinc-800 text-zinc-400 px-2 py-1 rounded-md border border-zinc-700/50">${h.qty.toLocaleString()} units</span>
                            </div>
                            <div class="text-xs text-zinc-500 font-mono">Market Price: $${(h.marketPrice||h.avgCost).toFixed(2)}</div>
                        </div>

                        <div class="text-right">
                            <div class="font-black text-white text-lg">${moneyFmt.format(marketVal)}</div>
                            <div class="text-xs font-bold text-zinc-400 mt-1">Target: <span class="text-indigo-400">${targetPct}%</span></div>
                        </div>
                    </div>

                    <div class="relative pt-4 pb-1">
                        <div class="flex mb-1 items-center justify-between">
                            <span class="text-[10px] font-bold uppercase text-zinc-500">Allocation</span>
                            <span class="text-[10px] font-bold uppercase ${barColor.replace('bg-', 'text-')}">Actual: ${currentPct.toFixed(1)}%</span>
                        </div>
                        <div class="overflow-hidden h-2.5 mb-1 text-xs flex rounded-full bg-zinc-800">
                            <div style="width:${Math.min(currentPct, 100)}%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center ${barColor} transition-all duration-500"></div>
                        </div>
                    </div>

                    ${actionHtml}

                    <div class="flex justify-end mt-3 pt-3 border-t border-zinc-800/50">
                         <button onclick="removeHolding('${h.ticker}')" class="text-xs font-bold text-zinc-600 hover:text-rose-500 flex items-center gap-1 transition-colors"><i data-lucide="trash-2" width="12"></i> Remove Asset</button>
                    </div>
                </div>`);
            });

            document.getElementById('total-value').innerText = moneyFmt.format(totalVal);
            document.getElementById('total-target-pct').innerText = totalTarget + '%';
            document.getElementById('total-target-pct').className = `text-2xl md:text-3xl font-black ${totalTarget === 100 ? 'text-emerald-500' : 'text-rose-500'}`;
            document.getElementById('chart-center-count').innerText = holdings.length;
            lucide.createIcons();
        }

        function updateCharts() {
            const ctxAlloc = document.getElementById('chartAlloc').getContext('2d');
            if (chartAllocInstance) chartAllocInstance.destroy();
            const sortedH = [...holdings].sort((a,b) => (b.qty*(b.marketPrice||b.avgCost)) - (a.qty*(a.marketPrice||a.avgCost)));
            
            chartAllocInstance = new Chart(ctxAlloc, {
                type: 'doughnut',
                data: { 
                    labels: sortedH.map(h => h.ticker), 
                    datasets: [{ 
                        data: sortedH.map(h => h.qty * (h.marketPrice || h.avgCost)), 
                        backgroundColor: ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f59e0b','#10b981','#06b6d4', '#64748b'], 
                        borderWidth: 0, 
                        hoverOffset: 10
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    cutout: '70%', 
                    plugins: { legend: { display: false } },
                    animation: { animateScale: true, animateRotate: true }
                }
            });
        }

        // --- DATA & SYNC ---
        function saveData() { localStorage.setItem('smart_port_holdings', JSON.stringify(holdings)); }
        function toggleSettings() { const m = document.getElementById('modal-settings'); m.classList.toggle('hidden'); m.classList.toggle('flex'); document.getElementById('inp-csv-link').value = config.csvUrl; }
        function saveSettings() { config.csvUrl = document.getElementById('inp-csv-link').value.trim(); localStorage.setItem('smart_port_config', JSON.stringify(config)); toggleSettings(); if(config.csvUrl) refreshPrices(); }
        
        function exportData() {
            const data = { h: holdings, c: config };
            navigator.clipboard.writeText(JSON.stringify(data)).then(() => alert("✅ Data copied to clipboard!"));
        }
        function importData() {
            const str = prompt("Paste your data string here:");
            if(str) {
                try {
                    const data = JSON.parse(str);
                    if(data.h) holdings = data.h;
                    if(data.c) config = data.c;
                    saveData(); localStorage.setItem('smart_port_config', JSON.stringify(config));
                    renderHoldings(); updateCharts(); alert("✅ Import successful!");
                } catch(e) { alert("❌ Invalid data format"); }
            }
        }

        async function refreshPrices() {
            if (!config.csvUrl) return alert("Please set Google Sheet CSV Link in Settings first!");
            const btn = document.getElementById('btn-refresh'); 
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin text-indigo-500"></i> Syncing...`;
            
            try {
                let res; try { res = await fetch(config.csvUrl); if(!res.ok) throw new Error(); } catch(e) { res = await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(config.csvUrl)); }
                const text = await res.text(); const rows = text.split(/\r?\n/); const headers = rows[0].split(',').map(h=>h.trim().toLowerCase());
                const idxTicker = headers.findIndex(h=>h.includes('ticker')||h.includes('symbol')); const idxPrice = headers.findIndex(h=>h.includes('price')||h.includes('close'));
                
                let cnt=0;
                for(let i=1; i<rows.length; i++) {
                    const c=rows[i].split(','); if(c.length<=idxPrice) continue;
                    const tk=c[idxTicker].trim().toUpperCase().replace(/['"]+/g,''); const pr=parseFloat(c[idxPrice].replace(/['"$]+/g,''));
                    if(tk && !isNaN(pr)) {
                        const h=holdings.find(x=>x.ticker===tk||tk.includes(':'+x.ticker));
                        if(h) { h.marketPrice=pr; cnt++; }
                    }
                }
                saveData(); renderHoldings(); updateCharts(); 
                document.getElementById('last-updated').innerText = 'Synced: '+new Date().toLocaleTimeString();
                if(cnt===0) alert("⚠️ No matching tickers found in CSV.");
            } catch(e) { alert("Error: "+e.message); } finally { 
                btn.innerHTML = originalText; lucide.createIcons();
            }
        }
    </script>
</body>
</html>
